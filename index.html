<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英単語カード</title>
<meta name="theme-color" content="#17866a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語カード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4dfd1; --bgdot:#cfc8b6; --ink:#1d1b16; --muted:#6c675c; --hint:#8a8477;
  --face:#f8f4ea; --face2:#efe9da; --line:#dcd4c2;
  --frame:#17866a; --frame2:#0f5f4b; --gold:#c89b3c; --teal:#1D9E75; --teal2:#9FE1CB; --purple:#7F77DD;
  --red:#d33b2f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#151b1d; --bgdot:#22302e; --hint:#7d877f; }
}
:root[data-theme="dark"]{ --bg:#151b1d; --bgdot:#22302e; --hint:#7d877f; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; background:var(--bg);
  background-image:radial-gradient(var(--bgdot) 1px, transparent 1.2px);
  background-size:18px 18px;
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.stage{ perspective:1400px; position:relative; }
.card{
  --p:0;
  position:relative; width:min(78vw,300px); aspect-ratio:63/88;
  transform-style:preserve-3d; cursor:pointer; touch-action:none;
  transition:transform .7s cubic-bezier(.2,.8,.2,1);
}
.card.flipped{ transform:rotateY(180deg); }
.card.press{ transition:transform .15s ease-out; transform:scale(calc(1 + var(--p)*.05)) rotate(calc(var(--p)*var(--p)*1deg)); }
.card.burst{ transition:transform .55s cubic-bezier(.3,0,.1,1), opacity .5s ease; transform:scale(1.18); opacity:0; }
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:14px; overflow:hidden;
  border:3px solid var(--frame);
  box-shadow:inset 0 0 0 4px var(--face), inset 0 0 0 5px var(--gold),
             0 18px 40px -18px rgba(0,0,0,.55);
  background:var(--face);
}
.face.back{ transform:rotateY(180deg); background:#f3eee2; }
/* charge ring + glow */
.card::before{
  content:""; position:absolute; inset:-9px; border-radius:22px; pointer-events:none;
  background:conic-gradient(from -90deg, var(--teal) calc(var(--p)*360deg), transparent 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  opacity:calc(var(--p)*1.2); z-index:3;
  transform:translateZ(1px);
}
.card::after{
  content:""; position:absolute; inset:-2px; border-radius:16px; pointer-events:none;
  box-shadow:0 0 calc(10px + var(--p)*60px) calc(var(--p)*14px) rgba(29,158,117,calc(.05 + var(--p)*.55));
  z-index:-1;
}
.sheen{
  position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light; z-index:2;
  background:linear-gradient(112deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%);
  background-size:280% 100%; background-position:120% 0; opacity:.85;
}
.card.press .sheen{ animation:sheen .9s linear infinite; }
@keyframes sheen{ from{ background-position:120% 0 } to{ background-position:-120% 0 } }
/* sparks */
.sparks{ position:absolute; inset:-30px; pointer-events:none; overflow:visible; z-index:4; }
.spark{
  position:absolute; bottom:10%; width:6px; height:6px; border-radius:50%;
  background:var(--teal2); box-shadow:0 0 8px 2px rgba(93,202,165,.7);
  animation:rise var(--d) cubic-bezier(.2,.6,.3,1) forwards;
}
@keyframes rise{ 0%{ transform:translate(0,0) scale(.4); opacity:0 } 15%{ opacity:1 } 100%{ transform:translate(var(--dx), calc(var(--dy)*-1)) scale(1.1); opacity:0 } }

/* front content */
.front{ padding:16px 15px 12px; display:flex; flex-direction:column; gap:8px; }
.word{ display:flex; justify-content:space-between; align-items:baseline; }
.word b{ font-family:"Fraunces",Georgia,"Times New Roman",serif; font-weight:400; font-size:34px; letter-spacing:-.01em; line-height:1; }
.word b.l{ font-size:27px; } .word b.xl{ font-size:22px; line-height:1.1; }
.word span{ font-size:11px; color:var(--muted); }
.pron{ display:flex; gap:10px; align-items:baseline; margin-top:-2px; }
.pron{ flex-wrap:wrap; row-gap:1px; } .pron code, .pron span{ white-space:nowrap; }
.pron code{ font-family:"SF Mono",Menlo,monospace; font-size:13px; color:var(--muted); }
.pron span{ font-size:12px; color:var(--hint); }
.fig{ margin:2px 0 0; }
.pills{ display:flex; gap:5px; flex-wrap:wrap; }
.pills span{ font-size:11px; padding:2px 8px; border-radius:10px; background:#E1F5EE; color:#085041; }
.pills span.n{ background:#EEEDFE; color:#3C3489; }
.core{ font-size:11.5px; color:var(--muted); line-height:1.55; border-top:1px solid var(--line); padding-top:7px; }
.ex{ border-top:1px solid var(--line); padding-top:7px; display:flex; flex-direction:column; gap:5px; }
.ex p{ margin:0; font-size:12.5px; line-height:1.4; }
.ex p b{ font-weight:600; color:var(--frame2); }
.ex p small{ display:block; font-size:10.5px; color:var(--hint); }
.foot{ margin-top:auto; display:flex; justify-content:space-between; font-size:10.5px; color:var(--hint); }
.foot i{ font-style:normal; color:var(--gold); letter-spacing:2px; }
@media (prefers-reduced-motion:no-preference){
  .m-out .mv{ animation:yout 2.4s ease-in-out infinite }
  .m-out .ar{ animation:yarr 2.4s ease-in-out infinite; transform-origin:0 50% }
  .m-out .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-in .mv{ animation:yin 2.4s ease-in-out infinite }
  .m-in .ar{ animation:yarr 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:100% 50% }
  .m-in .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-block .mv{ animation:yblk 2.4s ease-in-out infinite }
  .m-block .ar{ animation:yarr2 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0 50% }
  .m-block .wl{ animation:ywall 2.4s ease-in-out infinite }
  .m-block .gl{ animation:yhit 2.4s ease-in-out infinite }
  .m-point .ar{ animation:yarr 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0 50% }
  .m-point .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-change .mv{ animation:ychg 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50% }
  .m-settle .mv{ animation:ysettle 2.4s ease-in-out infinite }
  .m-settle .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-short .mv{ animation:yshort 2.4s ease-in-out infinite }
  .m-short .gl{ animation:yhit 2.4s ease-in-out infinite }
  .m-link .ar{ animation:ylinkln 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0 50% }
  .m-link .mv{ animation:ylink 2.4s ease-in-out infinite }
  .m-over .mv{ animation:yover 2.4s ease-in-out infinite }
  .m-over .wl{ animation:ywall2 2.4s ease-in-out infinite }
  .m-over .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-p-at .ar{ animation:yarrS 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0 0 }
  .m-p-at .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-p-in .mv{ animation:ypin 2.4s ease-in-out infinite }
  .m-p-in .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-p-on .mv{ animation:ypon 2.4s ease-in-out infinite }
  .m-p-on .gl{ animation:yhit 2.4s ease-in-out infinite }
  .m-p-to .mv{ animation:yto 2.4s ease-in-out infinite }
  .m-p-to .ar{ animation:yarr 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0 50% }
  .m-p-to .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-p-from .mv{ animation:yfrom 2.4s ease-in-out infinite }
  .m-p-from .gl{ animation:yorig 2.4s ease-in-out infinite }
  .m-p-with .mv{ animation:ywith 2.4s ease-in-out infinite }
  .m-scale .bm{ animation:yscale 2.4s ease-in-out infinite; transform-origin:190px 60px }
  .m-time .mv{ animation:ytime 2.4s ease-in-out infinite }
  .m-time .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-flow .ar, .m-against .ar{ animation:yarr 2.4s ease-in-out infinite; transform-box:fill-box; transform-origin:0 50% }
  .m-flow .gl, .m-against .gl, .m-add .gl, .m-branch .gl, .m-gate .gl, .m-gauge .gl{ animation:ygl 2.4s ease-in-out infinite }
  .m-against .ht{ animation:yhit2 2.4s ease-in-out infinite }
  .m-add .mv{ animation:ydrop 2.4s ease-in-out infinite }
  .m-contrast .ga{ animation:ycl 2.4s ease-in-out infinite }
  .m-contrast .gb{ animation:ycr 2.4s ease-in-out infinite }
  .m-branch .mv{ animation:ybranch 2.4s ease-in-out infinite }
  .m-gate .mv{ animation:ygate 2.4s ease-in-out infinite }
  .m-gate .arm{ animation:yarm 2.4s ease-in-out infinite; transform-origin:200px 60px }
  .m-equal .mv{ animation:yeqcol 2.4s ease-in-out infinite }
  .m-equal .gl{ animation:yeq 2.4s ease-in-out infinite }
  .m-gauge .mv{ animation:ygauge 2.4s ease-in-out infinite; transform-origin:190px 108px }
  .m-clarity .fog{ animation:yfog 2.4s ease-in-out infinite }
}

@keyframes ypon{0%{transform:translate(0,-62px);opacity:0}10%{transform:translate(0,-62px);opacity:1}45%{transform:translate(0,0)}52%{transform:translate(0,-9px)}58%{transform:translate(0,0)}88%{transform:translate(0,0);opacity:1}100%{transform:translate(0,0);opacity:0}}

@keyframes yscale{0%,10%{transform:rotate(0)}40%{transform:rotate(11deg)}50%{transform:rotate(7deg)}58%{transform:rotate(9deg)}86%{transform:rotate(9deg)}100%{transform:rotate(0)}}
@keyframes ytime{0%{transform:translate(0,0);opacity:0}10%{transform:translate(0,0);opacity:1}70%{transform:translate(240px,0)}88%{transform:translate(240px,0);opacity:1}100%{transform:translate(240px,0);opacity:0}}

@keyframes ygate{0%{transform:translate(0,0);opacity:0}10%{transform:translate(0,0);opacity:1}35%{transform:translate(118px,0)}52%{transform:translate(118px,0)}75%{transform:translate(240px,0)}88%{transform:translate(240px,0);opacity:1}100%{transform:translate(240px,0);opacity:0}}

/* back */
.back svg{ width:100%; height:100%; display:block; }

/* etymology face */
.etym{
  position:fixed; inset:0; z-index:20; background:var(--face);
  color:var(--ink); padding:calc(env(safe-area-inset-top,0px) + 28px) 26px calc(env(safe-area-inset-bottom,0px) + 24px);
  clip-path:circle(0 at var(--cx,50%) var(--cy,50%)); visibility:hidden;
  display:flex; flex-direction:column; overflow-y:auto;
}
.etym.show{ visibility:visible; clip-path:circle(160% at var(--cx,50%) var(--cy,50%)); transition:clip-path .75s cubic-bezier(.2,.7,.1,1); }
.etym.hide{ visibility:visible; clip-path:circle(0 at var(--cx,50%) var(--cy,50%)); transition:clip-path .5s cubic-bezier(.6,0,.8,.3), visibility 0s .5s; }
.etym h1{ font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:54px; margin:0 0 4px; letter-spacing:-.02em; line-height:1; }
.etym h1.l{ font-size:40px; line-height:1.1; }
.etym .old{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:18px; color:var(--muted); margin:0 0 26px; }
.etym p{ font-size:15.5px; line-height:1.9; margin:0 0 18px; max-width:34em; }
.etym .src{ margin-top:auto; font-size:11px; color:var(--hint); display:flex; justify-content:space-between; align-items:center; }
.etym button{
  appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
  font:inherit; font-size:13px; padding:8px 16px; border-radius:20px;
}
.etym button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
.flash{ position:fixed; inset:0; background:#fff; pointer-events:none; opacity:0; z-index:19; }
.flash.go{ animation:flash .55s ease-out; }
@keyframes flash{ 0%{opacity:0} 18%{opacity:.95} 100%{opacity:0} }

.hint{ margin-top:22px; font-size:12px; color:var(--hint); text-align:center; line-height:1.6; }
@media (prefers-reduced-motion:reduce){
  .card, .card.press, .etym.show, .etym.hide{ transition:none } .spark{ display:none } .flash.go{ animation:none }
}

/* ===== アプリ画面 ===== */
:root{ --onbg:#1d1b16; --onbg2:#6c675c; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --onbg:#ece6d8; --onbg2:#9aa39b; }
}
:root[data-theme="dark"]{ --onbg:#ece6d8; --onbg2:#9aa39b; }

.screen{
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);
  color:var(--onbg);
}
.screen.on{ display:flex; }
.btn{
  appearance:none; border:1px solid var(--line); background:var(--face); color:var(--ink);
  font:inherit; font-size:15px; padding:11px 26px; border-radius:24px; cursor:pointer;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.4);
}
.btn.primary{ background:var(--frame); border-color:var(--frame); color:#fff; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn:focus-visible, .link:focus-visible, .tile:focus-visible, .pack:focus-visible, .x:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }
.link{ appearance:none; border:0; background:none; font:inherit; font-size:13px; color:var(--onbg2); padding:8px; cursor:pointer; }
.x{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px;
  appearance:none; border:0; background:none; font-size:26px; line-height:1; color:var(--onbg2); padding:8px 12px; cursor:pointer;
}

/* パック：ゲージは中の光の水位 */
.pack{
  --g:0;
  position:relative; width:min(58vw,220px); aspect-ratio:63/100; border-radius:10px; overflow:hidden;
  background:linear-gradient(160deg, #1b9475 0%, #17866a 45%, #0f5f4b 100%);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.06), inset 0 0 0 6px var(--gold), 0 22px 44px -20px rgba(0,0,0,.6);
  cursor:pointer; touch-action:none; transition:transform .3s ease, box-shadow .3s ease;
}
.pack::before, .pack::after{
  content:""; position:absolute; left:0; right:0; height:11px; z-index:3;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, rgba(255,255,255,.08) 2px 5px);
}
.pack::before{ top:0; } .pack::after{ bottom:0; }
.pk-fill{
  position:absolute; left:0; right:0; bottom:0; height:calc(var(--g)*100%); z-index:1;
  background:linear-gradient(to top, rgba(159,225,203,.55), rgba(159,225,203,.14));
  border-top:1px solid rgba(255,255,255,.45); transition:height .8s cubic-bezier(.2,.8,.2,1);
}
.pk-in{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#f6efd9; }
.pk-in svg{ width:42%; height:auto; }
.pk-title{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-weight:300; font-size:22px; letter-spacing:.02em; }
.pk-sub{ font-size:11px; letter-spacing:.3em; opacity:.8; }
.pack .sheen{ z-index:2; }
.pack.ready{ box-shadow:inset 0 0 0 5px rgba(255,255,255,.06), inset 0 0 0 6px var(--gold), 0 0 34px 4px rgba(29,158,117,.45), 0 22px 44px -20px rgba(0,0,0,.6); }
@media (prefers-reduced-motion:no-preference){
  .pack.ready{ animation:bob 3.2s ease-in-out infinite; }
  .pack.ready .sheen{ animation:sheen 3.2s linear infinite; }
}
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.pack.locked{ cursor:default; }

.home-status{ margin-top:22px; font-size:14px; text-align:center; line-height:1.7; min-height:3.4em; }
.home-status small{ display:block; font-size:12px; color:var(--onbg2); }
.home-quiz{ margin-top:14px; }
.home-foot{ position:absolute; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); left:0; right:0; text-align:center; }

/* 開封 */
.tear-wrap{ position:relative; }
.pk-top{
  position:absolute; left:0; right:0; top:0; height:15%; z-index:4; pointer-events:none;
  border-bottom:1.5px dashed rgba(246,239,217,.7);
  transition:transform .55s cubic-bezier(.3,0,.2,1), opacity .55s ease;
}
.pk-cut{ position:absolute; left:0; bottom:-2px; height:3px; width:calc(var(--t,0)*100%); background:#fff; box-shadow:0 0 8px 2px rgba(159,225,203,.9); }
.pack.torn .pk-top{ transform:translate(30px,-90px) rotate(16deg); opacity:0; }
.pack.gone{ transition:transform .5s cubic-bezier(.4,0,.8,.4), opacity .5s ease; transform:translateY(40%) scale(.92); opacity:0; }
.open-word{ font-family:"Fraunces",Georgia,serif; font-weight:400; font-size:36px; letter-spacing:-.01em; min-height:48px; margin-bottom:14px; transition:opacity .4s ease; text-align:center; }
.open-word.off{ opacity:0; }
.open-ctl{ margin-top:22px; min-height:48px; display:flex; gap:12px; align-items:center; justify-content:center; font-size:14px; color:var(--onbg2); }
.open-count{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 18px); right:18px; font-size:12px; color:var(--onbg2); letter-spacing:.1em; }
.recall{ animation:breathe 1.5s ease-in-out infinite; }
@keyframes breathe{ 0%,100%{ opacity:.45 } 50%{ opacity:1 } }

/* 結果一覧・コレクション */
.list{ width:min(100%,360px); display:flex; flex-direction:column; gap:8px; margin:6px 0 22px; }
.row{ display:flex; align-items:baseline; gap:10px; padding:10px 14px; border-radius:10px; background:var(--face); color:var(--ink); border:1px solid var(--line); }
.row b{ font-family:"Fraunces",Georgia,serif; font-weight:400; font-size:20px; }
.row span{ font-size:12px; color:var(--muted); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row em, .tile em{ font-style:normal; font-size:11px; color:var(--hint); white-space:nowrap; }
.tag{ font-size:10.5px; padding:1px 7px; border-radius:9px; background:#E1F5EE; color:#085041; white-space:nowrap; }
.tag.k{ background:linear-gradient(100deg,#ffd6ec,#d6ecff,#dcffe6,#fff3c4); color:#5b4a14; }
.h2{ font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:28px; margin:0 0 14px; }

#collection{ justify-content:flex-start; overflow-y:auto; padding-top:calc(env(safe-area-inset-top,0px) + 60px); }
.grid{ width:min(100%,420px); display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; }
.tile{
  position:relative; appearance:none; font:inherit; cursor:pointer; aspect-ratio:63/88; border-radius:9px; overflow:hidden;
  border:2px solid var(--frame); background:var(--face); color:var(--ink);
  box-shadow:inset 0 0 0 3px var(--face), inset 0 0 0 3.5px var(--gold), 0 8px 18px -12px rgba(0,0,0,.5);
  display:flex; flex-direction:column; justify-content:space-between; align-items:flex-start; padding:10px 9px 8px; text-align:left;
}
.tile b{ font-family:"Fraunces",Georgia,serif; font-weight:400; font-size:17px; line-height:1.1; word-break:break-word; }
.tile i{ font-style:normal; color:var(--gold); font-size:10px; letter-spacing:1px; }
.tile .tf{ display:flex; flex-direction:column; gap:2px; }
.empty{ color:var(--onbg2); font-size:14px; margin:40px 0; text-align:center; line-height:1.8; }
.save{ display:flex; gap:10px; margin:30px 0 10px; flex-wrap:wrap; justify-content:center; }
.save .btn{ font-size:13px; padding:9px 18px; }

/* キラ加工：知らなかった語 */
.holo{ position:absolute; inset:0; pointer-events:none; z-index:1; mix-blend-mode:multiply; opacity:.55;
  background:linear-gradient(115deg, transparent 15%, #ffc9e6 28%, #c9e6ff 40%, #ccffdc 52%, #fff0b3 64%, #ffc9e6 76%, transparent 88%);
  background-size:300% 300%; background-position:0% 50%;
}
@media (prefers-reduced-motion:no-preference){ .holo{ animation:holo 6s ease-in-out infinite alternate; } }
@keyframes holo{ from{ background-position:0% 50% } to{ background-position:100% 50% } }

/* 小テスト */
#quiz{ justify-content:flex-start; padding-top:calc(env(safe-area-inset-top,0px) + 70px); }
.q-dir{ font-size:12px; color:var(--onbg2); letter-spacing:.1em; }
.q-n{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 22px); right:18px; font-size:12px; color:var(--onbg2); letter-spacing:.1em; }
.q-word{ margin:14px 0 30px; text-align:center; min-height:64px; display:flex; align-items:center; }
.q-word.en{ font-family:"Fraunces",Georgia,serif; font-weight:400; font-size:38px; letter-spacing:-.01em; }
.q-word.ja{ font-size:20px; line-height:1.6; max-width:20em; }
.q-opts{ width:min(100%,360px); display:flex; flex-direction:column; gap:10px; }
.q-opts .btn{ text-align:left; border-radius:14px; padding:13px 18px; font-size:15px; line-height:1.45; }
.q-opts .btn.en{ font-family:"Fraunces",Georgia,serif; font-size:19px; }
.q-opts .btn.ok{ background:#E1F5EE; border-color:var(--teal); color:#085041; }
.q-opts .btn.ng{ background:#fbe7e4; border-color:var(--red); color:#7a1f17; }
.q-plus{ height:22px; margin-top:16px; font-size:14px; color:var(--teal); opacity:0; transition:opacity .2s; }
.q-plus.on{ opacity:1; }
.q-show{ position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(20,22,20,.55); }
.q-show.on{ display:flex; }
.q-show .card{ pointer-events:none; }
.q-show .cap{ color:#f3eee2; font-size:13px; margin-top:16px; }
.simple .front{ justify-content:center; gap:18px; padding:22px 20px 14px; }
.simple .word b{ font-size:30px; }
.simple .mean{ font-size:16px; line-height:1.8; color:var(--ink); border-top:1px solid var(--line); padding-top:14px; }
.q-end{ font-family:"Fraunces",Georgia,serif; font-weight:300; font-size:56px; color:var(--onbg); line-height:1; }
.q-end-sub{ margin:12px 0 30px; font-size:14px; color:var(--onbg2); }

#viewer .hint{ color:var(--onbg2); }
</style>
</head>
<body>

<!-- 1. ホーム -->
<section class="screen" id="home">
  <div class="pack" id="pack" role="button" tabindex="0" aria-label="パック">
    <div class="pk-fill"></div>
    <div class="pk-in">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="#f3eee2" stroke="#c89b3c" stroke-width="1.4"/><g transform="translate(4 4) scale(.8)"><circle cx="20" cy="20" r="15" fill="none" stroke="#d33b2f" stroke-width="3.2"/><rect x="9" y="17.5" width="18" height="5" rx="1" fill="#2a2621"/><rect x="24" y="17.5" width="5" height="5" fill="#e0893a"/><path d="M12 14c0-2 2-2 2-4M15 13c0-2 2-2 2-4" fill="none" stroke="#8c8577" stroke-width="1.2" stroke-linecap="round"/><line x1="9.5" y1="9.5" x2="30.5" y2="30.5" stroke="#d33b2f" stroke-width="3.2" stroke-linecap="round"/></g></svg>
      <div class="pk-title">Words</div>
      <div class="pk-sub">初級語・5枚</div>
    </div>
    <div class="sheen"></div>
  </div>
  <div class="home-status" id="homeStatus"></div>
  <button type="button" class="btn home-quiz" id="quizBtn">小テスト</button>
  <div class="home-foot"><button type="button" class="link" id="collBtn"></button></div>
</section>

<!-- 2. 開封 -->
<section class="screen" id="open">
  <div class="open-count" id="openCount"></div>
  <div class="open-word off" id="openWord"></div>
  <div class="stage" id="openStage"></div>
  <div class="open-ctl" id="openCtl"></div>
</section>

<!-- 開封の結果一覧 -->
<section class="screen" id="result">
  <h2 class="h2">今回の5枚</h2>
  <div class="list" id="resultList"></div>
  <button type="button" class="btn primary" id="resultHome">ホームへ</button>
</section>

<!-- 3. カード -->
<section class="screen" id="viewer">
  <button type="button" class="x" id="viewerClose" aria-label="閉じる">×</button>
  <div class="stage" id="viewerStage"></div>
  <div class="hint">タップで裏面　／　長押しで語源</div>
</section>

<!-- 4. コレクション -->
<section class="screen" id="collection">
  <button type="button" class="x" id="collClose" aria-label="閉じる">×</button>
  <div class="grid" id="grid"></div>
  <div class="save">
    <button type="button" class="btn" id="exportBtn">書き出し</button>
    <button type="button" class="btn" id="importBtn">読み込み</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</section>

<!-- 5. 小テスト -->
<section class="screen" id="quiz">
  <button type="button" class="x" id="quizClose" aria-label="やめる">×</button>
  <div class="q-n" id="qN"></div>
  <div class="q-dir" id="qDir"></div>
  <div class="q-word" id="qWord"></div>
  <div class="q-opts" id="qOpts"></div>
  <div class="q-plus" id="qPlus">+1 ポイント</div>
</section>
<div class="q-show" id="qShow"><div class="stage" id="qShowStage"></div><div class="cap">正解</div></div>

<section class="screen" id="quizEnd">
  <div class="q-end" id="qEndPts"></div>
  <div class="q-end-sub" id="qEndSub"></div>
  <button type="button" class="btn primary" id="quizEndHome">ホームへ</button>
</section>

<div class="flash" id="flash"></div>
<section class="etym" id="etym" aria-hidden="true"></section>

<script>
(function(){
  var CATEGORY={ verb:'動詞', adverb:'副詞・接続語', idiom:'熟語' };

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /* 例文の focus 語だけ <b> にする（最初の1か所） */
  function emphasize(en, focus){
    var i=focus ? en.indexOf(focus) : -1;
    if(i<0) return esc(en);
    return esc(en.slice(0,i))+'<b>'+esc(focus)+'</b>'+esc(en.slice(i+focus.length));
  }

  /* 部品指定 "ball x3" → { kind:'ball', n:3 } */
  function part(spec){
    var m=/^(\w+)(?:\s*x(\d+))?$/.exec(spec||'');
    return m ? { kind:m[1], n:m[2] ? +m[2] : 1 } : { kind:'', n:0 };
  }

  /* ---- コアイメージ：部品 ---- */
  var BOX={ x:40, y:20, w:130, h:90 };
  var INSIDE_SLOTS=[[75,50],[110,80],[75,85]];

  function box(){
    return '<rect x="'+BOX.x+'" y="'+BOX.y+'" width="'+BOX.w+'" height="'+BOX.h+'" rx="8" fill="#eee9dc" stroke="#9a9384" stroke-width="1"/>';
  }
  function balls(n){
    var s='<g fill="#CECBF6" stroke="#7F77DD" stroke-width="1">';
    for(var i=0;i<Math.min(n,INSIDE_SLOTS.length);i++) s+='<circle cx="'+INSIDE_SLOTS[i][0]+'" cy="'+INSIDE_SLOTS[i][1]+'" r="12"/>';
    return s+'</g>';
  }
  function label(x, text){
    return '<text x="'+x+'" y="130" text-anchor="middle" font-size="12" fill="#6c675c">'+esc(text)+'</text>';
  }
  function labels(img, x0, x1){
    var l=img.labels||[];
    return (l[0] ? label(x0, l[0]) : '')+(l[1] ? label(x1, l[1]) : '');
  }
  function arrowDef(uid){
    return '<defs><marker id="'+uid+'-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>';
  }
  function arrow(uid, x1, x2){
    return '<line class="ar" x1="'+x1+'" y1="65" x2="'+x2+'" y2="65" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#'+uid+'-arrow)"/>';
  }
  function mover(cx){
    return '<circle class="mv" cx="'+cx+'" cy="65" r="12" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>';
  }
  function rings(cx){
    return '<g class="gl" fill="none"><circle cx="'+cx+'" cy="65" r="20" stroke="#5DCAA5" stroke-width=".8"/><circle cx="'+cx+'" cy="65" r="28" stroke="#9FE1CB" stroke-width=".8"/></g>';
  }
  function lbox(x){
    return '<rect x="'+x+'" y="40" width="70" height="50" rx="6" fill="#eee9dc" stroke="#9a9384" stroke-width="1"/>';
  }
  function ringsAt(cx, cy){
    return '<g class="gl" fill="none"><circle cx="'+cx+'" cy="'+cy+'" r="20" stroke="#5DCAA5" stroke-width=".8"/><circle cx="'+cx+'" cy="'+cy+'" r="28" stroke="#9FE1CB" stroke-width=".8"/></g>';
  }
  function insides(p){
    var inside=part(p.inside);
    return inside.kind==='ball' ? balls(inside.n) : '';
  }

  /* ---- コアイメージ：動きの型 ---- */
  var MOTIONS={
    out: {
      aria:'箱から球が外へ出るコアイメージ',
      draw: function(img, uid){
        return arrowDef(uid)+box()+insides(img.parts||{})
          +arrow(uid, 172, 300)+mover(145)+rings(285)
          +labels(img, 105, 285);
      }
    },
    /* 外の球が箱の中へ入る。箱の縁が光る */
    in: {
      aria:'外の球が箱の中へ入るコアイメージ',
      draw: function(img, uid){
        return arrowDef(uid)+box()+insides(img.parts||{})
          +arrow(uid, 300, 172)+mover(145)
          +'<g class="gl" fill="none"><rect x="36" y="16" width="138" height="98" rx="10" stroke="#5DCAA5" stroke-width=".8"/><rect x="31" y="11" width="148" height="108" rx="12" stroke="#9FE1CB" stroke-width=".8"/></g>'
          +labels(img, 105, 285);
      }
    },
    /* 球が進んで壁に当たり、押し返される */
    block: {
      aria:'進む球が壁に止められるコアイメージ',
      draw: function(img, uid){
        return arrowDef(uid)
          +arrow(uid, 48, 205)
          +'<g class="wl"><rect x="230" y="15" width="14" height="100" rx="2" fill="#e3dccb" stroke="#9a9384" stroke-width="1"/>'
          +'<path d="M230 35L244 25M230 55L244 45M230 75L244 65M230 95L244 85M230 115L244 105" stroke="#b8b09f" stroke-width=".8"/></g>'
          +'<g class="gl" fill="none" stroke="#5DCAA5" stroke-width="1.2" stroke-linecap="round"><path d="M224 47L216 40M224 83L216 90M222 65L212 65"/></g>'
          +mover(60)
          +labels(img, 105, 237);
      }
    },
    /* 左の球から矢印が伸び、指した先が光る */
    point: {
      aria:'一点から先の対象を指すコアイメージ',
      draw: function(img, uid){
        var t=part((img.parts||{}).target).kind;
        var target=t==='box'
          ? '<rect x="258" y="40" width="64" height="50" rx="6" fill="#eee9dc" stroke="#9a9384" stroke-width="1"/><circle cx="290" cy="65" r="9" fill="#CECBF6" stroke="#7F77DD" stroke-width="1"/>'
          : '<circle cx="290" cy="65" r="13" fill="#CECBF6" stroke="#7F77DD" stroke-width="1"/>';
        return arrowDef(uid)
          +'<circle cx="70" cy="65" r="12" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>'
          +arrow(uid, 88, (t==='box' ? 250 : 270))
          +target+rings(290)
          +labels(img, 70, 290);
      }
    },
    /* 球が進みながら色と大きさを変えていく */
    change: {
      aria:'球が進みながら姿を変えるコアイメージ',
      draw: function(img, uid){
        return '<line x1="60" y1="65" x2="300" y2="65" stroke="#cfc8b6" stroke-width="1" stroke-dasharray="3 5"/>'
          +'<circle cx="60" cy="65" r="12" fill="none" stroke="#9FE1CB" stroke-width="1" stroke-dasharray="2 3"/>'
          +'<circle cx="300" cy="65" r="17" fill="none" stroke="#CECBF6" stroke-width="1" stroke-dasharray="2 3"/>'
          +'<circle class="mv" cx="60" cy="65" r="12" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>'
          +labels(img, 60, 300);
      }
    },
    /* 揺れていた球が、くぼみの底に落ち着く */
    settle: {
      aria:'揺れる球がくぼみに落ち着くコアイメージ',
      draw: function(img, uid){
        return '<path d="M110 80Q190 125 270 80" fill="none" stroke="#9a9384" stroke-width="1.5" stroke-linecap="round"/>'
          +'<g class="gl" fill="none"><circle cx="190" cy="90.5" r="20" stroke="#5DCAA5" stroke-width=".8"/><circle cx="190" cy="90.5" r="28" stroke="#9FE1CB" stroke-width=".8"/></g>'
          +'<circle class="mv" cx="190" cy="90.5" r="12" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>'
          +labels(img, 110, 270);
      }
    },
    /* 球が目標へ向かうが、切れ目で落ちて届かない */
    short: {
      aria:'球が目標に届かず途中で落ちるコアイメージ',
      draw: function(img, uid){
        return '<path d="M30 80H182M226 80H340" stroke="#9a9384" stroke-width="1.5" stroke-linecap="round"/>'
          +'<path d="M182 80V96M226 80V96" stroke="#cfc8b6" stroke-width="1" stroke-dasharray="2 3"/>'
          +'<circle cx="300" cy="68" r="13" fill="none" stroke="#7F77DD" stroke-width="1" stroke-dasharray="3 3"/>'
          +'<g class="gl" fill="none" stroke="#d9a35b" stroke-width="1.2" stroke-linecap="round"><path d="M196 100L190 108M204 102V111M212 100L218 108"/></g>'
          +'<circle class="mv" cx="60" cy="68" r="12" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>'
          +labels(img, 60, 300);
      }
    },
    /* 二つの球の間に線が張られ、小さな球が行き来する */
    link: {
      aria:'二つのものの間を線が結ぶコアイメージ',
      draw: function(img, uid){
        return '<line class="ar" x1="84" y1="65" x2="286" y2="65" stroke="#1D9E75" stroke-width="1.5"/>'
          +'<circle cx="70" cy="65" r="13" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>'
          +'<circle cx="300" cy="65" r="13" fill="#CECBF6" stroke="#7F77DD" stroke-width="1"/>'
          +'<circle class="mv" cx="88" cy="65" r="5" fill="#fff" stroke="#1D9E75" stroke-width="1"/>'
          +labels(img, 70, 300);
      }
    },
    /* 球が壁に当たり、押し勝って乗り越える */
    over: {
      aria:'球が壁を乗り越えるコアイメージ',
      draw: function(img, uid){
        return '<path d="M30 115H340" stroke="#cfc8b6" stroke-width="1"/>'
          +'<g class="wl"><rect x="195" y="55" width="12" height="60" rx="2" fill="#e3dccb" stroke="#9a9384" stroke-width="1"/>'
          +'<path d="M195 72L207 62M195 89L207 79M195 106L207 96" stroke="#b8b09f" stroke-width=".8"/></g>'
          +'<g class="gl" fill="none"><circle cx="290" cy="103" r="16" stroke="#5DCAA5" stroke-width=".8"/><circle cx="290" cy="103" r="21" stroke="#9FE1CB" stroke-width=".8"/></g>'
          +'<circle class="mv" cx="60" cy="103" r="12" fill="#9FE1CB" stroke="#1D9E75" stroke-width="1"/>'
          +labels(img, 90, 290);
      }
    },

    /* ===== 熟語：前置詞の図 ===== */
    /* at：線の上の一点を矢印が突く */
    'p-at': {
      aria:'線の上の一点を指すコアイメージ',
      draw: function(img, uid){
        var ticks='';
        for(var x=60;x<=330;x+=30) ticks+='M'+x+' 91V99';

  /* ---- カード（表・裏） ---- */
  var seq=0;
  function sizeClass(w){ return w.length>14 ? ' class="xl"' : w.length>9 ? ' class="l"' : ''; }
  function cardHTML(c, kira){
    var uid='c'+(++seq)+'-'+c.id.replace(/[^\w-]/g,'_');
    var pills=(c.senses||[]).map(function(s){ return '<span>'+esc(s)+'</span>'; }).join('')
      +(c.senses_noun||[]).map(function(s){ return '<span class="n">名：'+esc(s)+'</span>'; }).join('');
    var ex=(c.examples||[]).map(function(e){
      return '<p>'+emphasize(e.en, e.focus)+'<small>'+esc(e.ja)+'</small></p>';
    }).join('');
    return ''
      +'<div class="card'+(kira ? ' kira' : '')+'" role="button" tabindex="0" aria-label="'+esc(c.word)+' のカード。タップで裏返す、長押しで語源">'
      +  '<div class="face front">'
      +    '<div class="word"><b'+sizeClass(c.word)+'>'+esc(c.word)+'</b><span>'+esc(c.pos)+'</span></div>'
      +    '<div class="pron"><code>'+esc(c.ipa)+'</code><span>'+esc(c.kana)+'</span></div>'
      +    figure(c.image, uid)
      +    '<div class="pills">'+pills+'</div>'
      +    '<div class="core">'+esc(c.core)+'</div>'
      +    '<div class="ex">'+ex+'</div>'
      +    '<div class="foot"><span>初級語　'+esc(CATEGORY[c.category]||'')+'</span><i>'+(kira ? '◆◆◆' : '◇◇◇')+'</i></div>'
      +    (kira ? '<div class="holo"></div>' : '')
      +    '<div class="sheen"></div>'
      +  '</div>'
      +  '<div class="face back" aria-hidden="true">'+back(uid)+'</div>'
      +  '<div class="sparks"></div>'
      +'</div>';
  }

  /* ---- 語源面 ---- */
  function etymHTML(c){
    var et=c.etymology||{};
    return ''
      +'<h1'+(c.word.length>10 ? ' class="l"' : '')+'>'+esc(c.word)+'</h1>'
      +'<p class="old">'+esc(et.origin||'')+'</p>'
      +(et.paragraphs||[]).map(function(p){ return '<p>'+esc(p)+'</p>'; }).join('')
      +'<div class="src"><span>'+(et.verified ? '' : '語源：要確認（辞書で検証する）')+'</span><button type="button" class="close">カードに戻る</button></div>';
  }

  var etym=document.getElementById('etym'), flash=document.getElementById('flash');
  var etymCard=null, etymDone=null;

  function showEtym(c, card, x, y, onClosed){
    etym.innerHTML=etymHTML(c);
    var closeBtn=etym.querySelector('.close');
    closeBtn.addEventListener('click', closeEtym);
    etymCard=card; etymDone=onClosed;
    etym.style.setProperty('--cx', x+'px'); etym.style.setProperty('--cy', y+'px');
    setTimeout(function(){
      card.classList.add('burst');
      etym.classList.remove('hide'); etym.classList.add('show'); etym.setAttribute('aria-hidden','false');
      closeBtn.focus({preventScroll:true});
    },120);
  }
  function closeEtym(){
    if(!etymCard) return;
    var card=etymCard, done=etymDone; etymCard=null;
    etym.classList.remove('show'); etym.classList.add('hide'); etym.setAttribute('aria-hidden','true');
    card.classList.remove('burst');
    setTimeout(function(){ etym.classList.remove('hide'); if(done) done(); },520);
  }
  etym.addEventListener('keydown', function(e){ if(e.key==='Escape') closeEtym(); });

  /* ---- 操作（見本と同じ）。card.dataset.locked の間は反応しない ---- */
  function bindCard(card, c){
    var sparks=card.querySelector('.sparks');
    var HOLD=1100, TAP=300;
    var pressing=false, start=0, raf=0, sx=0, sy=0, moved=false, lastSpark=0, done=false, pid=null;

    function setP(p){ card.style.setProperty('--p', p.toFixed(3)); }

    function spawn(p){
      var s=document.createElement('span'); s.className='spark';
      s.style.left=(5+Math.random()*90)+'%';
      s.style.setProperty('--dx', ((Math.random()-.5)*60)+'px');
      s.style.setProperty('--dy', (60+Math.random()*180*(0.4+p))+'px');
      s.style.setProperty('--d', (0.7+Math.random()*0.6)+'s');
      s.style.width=s.style.height=(3+Math.random()*5)+'px';
      if(Math.random()<.25){ s.style.background='#c89b3c'; s.style.boxShadow='0 0 8px 2px rgba(200,155,60,.7)'; }
      sparks.appendChild(s);
      s.addEventListener('animationend', function(){ s.remove(); });
    }

    function loop(now){
      if(!pressing) return;
      var p=Math.min(1,(now-start)/HOLD);
      setP(p);
      var gap=140-120*p;
      if(now-lastSpark>gap){ spawn(p); lastSpark=now; if(p>.6) spawn(p); }
      if(p>=1){ complete(); return; }
      raf=requestAnimationFrame(loop);
    }

    function release(){
      pressing=false; cancelAnimationFrame(raf);
      card.classList.remove('press');
      try{ if(pid!==null) card.releasePointerCapture(pid); }catch(e){}
      pid=null;
      setP(0);
    }

    function complete(){
      if(done) return; done=true;
      pressing=false; cancelAnimationFrame(raf);
      card.classList.remove('press');
      try{ if(pid!==null) card.releasePointerCapture(pid); }catch(e){}
      for(var i=0;i<28;i++) spawn(1);
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      showEtym(c, card, sx, sy, function(){ done=false; });
      setTimeout(function(){ setP(0); },400);
    }

    card.addEventListener('pointerdown', function(e){
      if(done || card.dataset.locked) return;
      if(card.classList.contains('flipped')){ pressing=false; start=performance.now(); moved=false; return; }
      pressing=true; moved=false; start=performance.now(); lastSpark=start; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
      try{ card.setPointerCapture(pid); }catch(err){}
      card.classList.add('press');
      raf=requestAnimationFrame(loop);
      e.preventDefault();
    });
    card.addEventListener('pointermove', function(e){
      if(Math.abs(e.clientX-sx)>12||Math.abs(e.clientY-sy)>12) moved=true;
    });
    function up(e){
      if(done || card.dataset.locked) return;
      var dt=performance.now()-start;
      var wasPressing=pressing;
      if(wasPressing) release();
      if(dt<TAP && !moved) card.classList.toggle('flipped');
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', function(){ if(pressing) release(); });
    card.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    card.addEventListener('keydown', function(e){
      if(card.dataset.locked) return;
      if(e.key===' '||e.key==='Enter'){ e.preventDefault(); card.classList.toggle('flipped'); }
      if(e.key==='e'||e.key==='E'){ sx=innerWidth/2; sy=innerHeight/2; complete(); }
    });
  }

  function mountCard(host, c, o){
    o=o||{};
    host.innerHTML=cardHTML(c, o.kira);
    var el=host.querySelector('.card');
    if(o.flipped) el.classList.add('flipped');
    if(o.locked) el.dataset.locked='1';
    if(!o.inert) bindCard(el, c);
    return el;
  }

  /* =====================================================
     状態（localStorage）
     ===================================================== */
  var HOUR=3600e3, FULL=6*HOUR, PACK=5, PACK_NEW=2, RECALL=3000, SHOW_ANSWER=3000;
  var KEY='eitango.v1';

  function fresh(){
    return {
      v:1,
      owned:{},          /* id → { order, first, met, kira } */
      nextOrder:1,
      charge:2*FULL,     /* ゲージ（ms）。初期は2パック分 */
      chargeAt:Date.now(),
      points:0,
      lastOpen:null,
      quizLog:{},        /* id → 出題日 'YYYY-MM-DD'（当日分だけ残す） */
      pending:null       /* 開封途中のパック */
    };
  }
  function valid(s){ return s && s.v===1 && typeof s.owned==='object' && typeof s.charge==='number'; }
  function load(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(valid(s)) return s; }catch(e){}
    return fresh();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  /* ゲージは満タン未満のときだけ時間で溜まる。満タン以上（初期の2パック分など）はそのまま */
  function charge(){
    var c=S.charge;
    if(c<FULL) c=Math.min(FULL, c+Math.max(0, Date.now()-S.chargeAt));
    return c;
  }
  function settle(){ S.charge=charge(); S.chargeAt=Date.now(); }
  function pointsNeeded(){ var c=charge(); return c>=FULL ? 0 : Math.ceil((FULL-c)/HOUR); }

  function dayKey(t){
    var d=t ? new Date(t) : new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }
  function shuffle(a){
    a=a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmt(ms){
    var m=Math.ceil(ms/60000), h=Math.floor(m/60); m=m%60;
    return h ? h+'時間'+(m ? m+'分' : '') : m+'分';
  }

  var S, CARDS=[], BYID={}, APPROVED=[], WORDS=[];

  /* =====================================================
     画面切り替え
     ===================================================== */
  var screens=['home','open','result','viewer','collection','quiz','quizEnd'];
  var current=null, homeTimer=0;
  function show(name){
    screens.forEach(function(s){ document.getElementById(s).classList.toggle('on', s===name); });
    current=name;
    clearInterval(homeTimer);
    if(name==='home'){ renderHome(); homeTimer=setInterval(renderHome, 20000); }
  }
  function $(id){ return document.getElementById(id); }

  /* =====================================================
     1. ホーム
     ===================================================== */
  var pack=$('pack');
  function renderHome(){
    var c=charge(), n=Math.floor(c/FULL), need=pointsNeeded();
    pack.style.setProperty('--g', Math.min(1, c/FULL).toFixed(3));
    var st='', can=false;
    if(S.pending){
      st='開封の続き'; can=true;
    }else if(!APPROVED.length){
      st='承認済みのカードがまだありません';
    }else if(n>=1){
      st=n>=2 ? '開けられます　×'+n : '開けられます'; can=true;
    }else{
      st='あと '+fmt(FULL-c);
      if(S.points>=need){ st+='<small>'+need+'ポイントを使えば今すぐ開けられます</small>'; can=true; }
    }
    $('homeStatus').innerHTML=st+'<small>ポイント '+S.points+'</small>';
    pack.classList.toggle('ready', can);
    pack.classList.toggle('locked', !can);
    pack.setAttribute('aria-label', 'パック。'+$('homeStatus').textContent);
    var owned=Object.keys(S.owned).length;
    $('collBtn').textContent='コレクション　'+owned+'枚';
  }
  function tapPack(){
    if(!pack.classList.contains('ready')) return;
    if(!S.pending){
      settle();
      if(S.charge<FULL){
        var need=pointsNeeded();
        if(S.points<need) return;
        S.points-=need; S.charge+=need*HOUR;
      }
      S.charge-=FULL; S.chargeAt=Date.now(); S.lastOpen=Date.now();
      S.pending={ cards:composePack(), idx:0, torn:false };
      save();
    }
    startOpen();
  }
  pack.addEventListener('click', tapPack);
  pack.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tapPack(); } });

  /* 手持ち3枚（復習）＋未所持2枚（発見）。未所持が足りなければ手持ちで、手持ちが足りなければ未所持で埋める。
     発見を最後に置く */
  function composePack(){
    var ids=APPROVED.map(function(c){ return c.id; });
    var have=shuffle(ids.filter(function(id){ return S.owned[id]; }));
    var fresh_=shuffle(ids.filter(function(id){ return !S.owned[id]; }));
    var n=Math.min(PACK, ids.length);
    var nNew=Math.min(PACK_NEW, fresh_.length);
    var nOld=Math.min(n-nNew, have.length);
    nNew=Math.min(n-nOld, fresh_.length);
    return have.slice(0,nOld).map(function(id){ return { id:id, isNew:false, done:false }; })
      .concat(fresh_.slice(0,nNew).map(function(id){ return { id:id, isNew:true, done:false }; }));
  }

  /* =====================================================
     2. 開封：破く → 1枚ずつ反転 → 結果一覧
     ===================================================== */
  function startOpen(){
    var P=S.pending;
    show('open');
    if(!P.torn) renderTear(); else renderOpenCard();
  }

  function renderTear(){
    $('openCount').textContent='';
    $('openWord').textContent=''; $('openWord').classList.add('off');
    $('openStage').innerHTML='<div class="tear-wrap"><div class="pack ready" id="tearPack" tabindex="0" role="button" aria-label="パックを破く">'
      +pack.innerHTML+'<div class="pk-top"><div class="pk-cut"></div></div></div></div>';
    $('openCtl').textContent='上の端を横になぞって破く';
    var tp=$('tearPack'), top=tp.querySelector('.pk-top'), sx=0, on=false, torn=false;
    tp.style.setProperty('--g','1');
    function setT(t){ top.style.setProperty('--t', t.toFixed(3)); }
    tp.addEventListener('pointerdown', function(e){
      if(torn) return; on=true; sx=e.clientX;
      try{ tp.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    tp.addEventListener('pointermove', function(e){
      if(!on||torn) return;
      var t=Math.min(1, Math.abs(e.clientX-sx)/(tp.offsetWidth*.7));
      setT(t);
      if(t>=1) tear();
    });
    function end(){ if(!torn){ on=false; setT(0); } }
    tp.addEventListener('pointerup', end);
    tp.addEventListener('pointercancel', end);
    tp.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setT(1); tear(); } });
    function tear(){
      if(torn) return; torn=true; on=false;
      tp.classList.add('torn');
      $('openCtl').textContent='';
      setTimeout(function(){ tp.classList.add('gone'); }, 380);
      setTimeout(function(){ S.pending.torn=true; save(); renderOpenCard(); }, 900);
    }
    tp.focus({preventScroll:true});
  }

  function renderOpenCard(){
    var P=S.pending, e=P.cards[P.idx], c=BYID[e.id];
    $('openCount').textContent=(P.idx+1)+' / '+P.cards.length;
    var w=$('openWord'); w.textContent=c.word; w.classList.remove('off');
    var o=S.owned[e.id];
    var card=mountCard($('openStage'), c, { kira:o&&o.kira, flipped:!e.done, locked:!e.done });
    var ctl=$('openCtl');
    if(e.done){ nextButton(); w.classList.add('off'); return; }

    if(e.isNew){
      ctl.innerHTML='<button type="button" class="btn" data-k="0">知ってる</button><button type="button" class="btn" data-k="1">知らない</button>';
      ctl.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          var unknown=b.dataset.k==='1';
          S.owned[e.id]={ order:S.nextOrder++, first:Date.now(), met:1, kira:unknown };
          e.done=true; save();
          if(unknown){ mountCard($('openStage'), c, { kira:true, flipped:true, locked:true }); card=$('openStage').querySelector('.card'); void card.offsetWidth; }
          reveal(card);
        });
      });
    }else{
      /* ダブり：反転前に意味を思い出す時間 */
      ctl.innerHTML='<span class="recall">意味を思い出す</span>';
      setTimeout(function(){
        if(current!=='open' || S.pending!==P || P.idx!==P.cards.indexOf(e)) return;
        S.owned[e.id].met++;
        e.done=true; save();
        reveal(card);
      }, RECALL);
    }
  }

  function reveal(card){
    $('openCtl').innerHTML='';
    $('openWord').classList.add('off');
    card.classList.remove('flipped');
    setTimeout(function(){ delete card.dataset.locked; nextButton(); }, 700);
  }

  function nextButton(){
    var P=S.pending, last=P.idx>=P.cards.length-1;
    $('openCtl').innerHTML='<button type="button" class="btn primary">'+(last ? '結果を見る' : '次へ')+'</button>';
    $('openCtl').querySelector('button').addEventListener('click', function(){
      if(last){ finishOpen(); return; }
      P.idx++; save(); renderOpenCard();
    });
  }

  function finishOpen(){
    var P=S.pending; S.pending=null; save();
    var list=$('resultList');
    list.innerHTML=P.cards.map(function(e){
      var c=BYID[e.id], o=S.owned[e.id];
      return '<div class="row"><b>'+esc(c.word)+'</b><span>'+esc((c.senses||[])[0]||'')+'</span>'
        +(e.isNew ? '<i class="tag">新しく出会った</i>' : '')
        +(o.kira ? '<i class="tag k">キラ</i>' : '')
        +'<em>会った '+o.met+'回</em></div>';
    }).join('');
    document.querySelector('#result .h2').textContent='今回の'+P.cards.length+'枚';
    show('result');
  }
  $('resultHome').addEventListener('click', function(){ show('home'); });

  /* =====================================================
     3. カード／4. コレクション
     ===================================================== */
  function renderCollection(){
    var ids=Object.keys(S.owned).filter(function(id){ return BYID[id]; })
      .sort(function(a,b){ return S.owned[a].order-S.owned[b].order; });
    var g=$('grid');
    if(!ids.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">まだカードがありません</div>'; return; }
    g.innerHTML=ids.map(function(id){
      var c=BYID[id], o=S.owned[id];
      return '<button type="button" class="tile'+(o.kira ? ' kira' : '')+'" data-id="'+esc(id)+'">'
        +(o.kira ? '<div class="holo"></div>' : '')
        +'<b>'+esc(c.word)+'</b>'
        +'<span class="tf"><em>会った '+o.met+'回</em><i>'+(o.kira ? '◆◆◆' : '◇◇◇')+'</i></span></button>';
    }).join('');
  }
  $('grid').addEventListener('click', function(e){
    var t=e.target.closest('.tile'); if(!t) return;
    var id=t.dataset.id;
    mountCard($('viewerStage'), BYID[id], { kira:S.owned[id].kira });
    show('viewer');
  });
  $('collBtn').addEventListener('click', function(){ renderCollection(); show('collection'); });
  $('collClose').addEventListener('click', function(){ show('home'); });
  $('viewerClose').addEventListener('click', function(){ renderCollection(); show('collection'); });

  /* 保存：JSON の書き出し／読み込み */
  $('exportBtn').addEventListener('click', function(){
    var blob=new Blob([JSON.stringify(S, null, 1)], { type:'application/json' });
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='eitango-'+dayKey().replace(/-/g,'')+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  $('importBtn').addEventListener('click', function(){ $('importFile').click(); });
  $('importFile').addEventListener('change', function(){
    var f=this.files[0]; this.value='';
    if(!f) return;
    f.text().then(function(t){
      var s; try{ s=JSON.parse(t); }catch(e){ s=null; }
      if(!valid(s)){ alert('このファイルは読み込めません'); return; }
      if(!confirm('いまの記録をこのファイルの内容で置き換えます')) return;
      S=s; save(); renderCollection();
    });
  });

  /* =====================================================
     5. 小テスト：255語からランダム5問。英→日と日→英を交互に
     ===================================================== */
  var Q=null;
  function startQuiz(){
    var today=dayKey();
    Object.keys(S.quizLog).forEach(function(id){ if(S.quizLog[id]!==today) delete S.quizLog[id]; });
    var pool=WORDS.filter(function(w){ return !S.quizLog[w.id]; });
    if(pool.length<5) pool=WORDS;
    Q={ items:shuffle(pool).slice(0,5), i:0, got:0, busy:false };
    show('quiz');
    renderQ();
  }
  function renderQ(){
    var w=Q.items[Q.i], enja=Q.i%2===0;
    S.quizLog[w.id]=dayKey(); save();
    $('qN').textContent=(Q.i+1)+' / '+Q.items.length;
    $('qDir').textContent=enja ? '英 → 日' : '日 → 英';
    var qw=$('qWord'); qw.className='q-word '+(enja ? 'en' : 'ja'); qw.textContent=enja ? w.word : w.meaning;
    var others=shuffle(WORDS.filter(function(x){ return x.category===w.category && x.id!==w.id && x.meaning!==w.meaning && x.word!==w.word; })).slice(0,3);
    var opts=shuffle([w].concat(others));
    $('qOpts').innerHTML=opts.map(function(x){
      return '<button type="button" class="btn'+(enja ? '' : ' en')+'" data-id="'+esc(x.id)+'">'+esc(enja ? x.meaning : x.word)+'</button>';
    }).join('');
    $('qPlus').classList.remove('on');
    Q.busy=false;
  }
  $('qOpts').addEventListener('click', function(e){
    var b=e.target.closest('.btn'); if(!b||Q.busy) return;
    Q.busy=true;
    var w=Q.items[Q.i], right=b.dataset.id===w.id;
    var rb=$('qOpts').querySelector('[data-id="'+CSS.escape(w.id)+'"]');
    rb.classList.add('ok');
    if(right){
      Q.got++; S.points++; save();
      $('qPlus').classList.add('on');
      setTimeout(nextQ, 800);
    }else{
      b.classList.add('ng');
      setTimeout(function(){ showAnswer(w); }, 500);
    }
  });
  /* 不正解：正解のカードを3秒だけ見せる。承認済みのカードがあればそれ、なければ語と訳語だけ */
  function showAnswer(w){
    var c=BYID[w.id], host=$('qShowStage');
    if(c && c.status==='approved') mountCard(host, c, { kira:S.owned[w.id]&&S.owned[w.id].kira, inert:true });
    else host.innerHTML=simpleHTML(w);
    $('qShow').classList.add('on');
    setTimeout(function(){ $('qShow').classList.remove('on'); host.innerHTML=''; nextQ(); }, SHOW_ANSWER);
  }
  function nextQ(){
    if(!Q || current!=='quiz') return;
    Q.i++;
    if(Q.i<Q.items.length){ renderQ(); return; }
    $('qEndPts').textContent='+'+Q.got;
    $('qEndSub').textContent='ポイントを足しました　（いま '+S.points+'ポイント）';
    show('quizEnd');
  }
  $('quizBtn').addEventListener('click', startQuiz);
  $('quizClose').addEventListener('click', function(){ Q=null; $('qShow').classList.remove('on'); show('home'); });
  $('quizEndHome').addEventListener('click', function(){ show('home'); });

  /* =====================================================
     起動
     ===================================================== */
  S=load();
  Promise.all([
    fetch('cards.json').then(function(r){ return r.json(); }),
    fetch('words.json').then(function(r){ return r.json(); })
  ]).then(function(res){
    CARDS=res[0]; WORDS=res[1];
    CARDS.forEach(function(c){ BYID[c.id]=c; });
    APPROVED=CARDS.filter(function(c){ return c.status==='approved'; });
    /* 承認が取り消された語が開封途中のパックにあれば外す */
    if(S.pending){
      S.pending.cards=S.pending.cards.filter(function(e){ return BYID[e.id]; });
      if(!S.pending.cards.length || S.pending.idx>=S.pending.cards.length) S.pending=null;
    }
    save();
    show('home');
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && current==='home') renderHome(); });

  /* オフライン用（PWA） */
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
