  /* =====================================================
     8. コレクションテスト：持っているカードの中から5問。LINE 風に先生が出題し、KANTAくん側の吹き出しから選ぶ。
        問題は「説明全文の1文に穴1つ、4択」（穴の語句は cloze.json、誤答は穴埋めと同じ選び方）。
        「覚えた気がする」と言った語から先に出す（5問のうち4問まで）。同じ日の再出題の決まりは当てはめない。
        正解：1ポイント、キラ → ノーマル（learned に日時）。不正解：キラに戻す。セリフは定型からランダム（API は使わない）
     ===================================================== */
  var CT_LINES={
    claimOk:{ t:['おお、本当に覚えていましたね。疑ってすみません。', '正解です。「気がする」じゃなくて、本当に覚えてましたね。', 'やりますね。約束どおりです。', '正解。これはもう、覚えたと言っていいですね。', 'お見事。宣言どおりでした。'],
              k:['ほら！ 言ったじゃないですか！', 'やった！ 信じてもらえてよかったです。', '当然です（内心ほっとしてます）。', 'よし！ 覚えた気がしたのは本物でした。', 'ふふん。次もどんどん出してください。'] },
    claimNg:{ t:['覚えたって言ってましたよね？ 覚えてないじゃないですか笑', 'あれ？ 「覚えた気がする」の「気がする」のほうでしたね笑', '……約束はどこへ行ったんでしょう笑', 'さっきの自信はどこへ行きました？笑', 'これは「覚えた気がしていた」でしたね笑'],
              k:['うわあ……完全に覚えたと思ったのに。', 'そんな……あのときは覚えてたんです……！', 'くっ……もう一回、覚え直します。', '恥ずかしい……次こそは本当に。', '気がしただけでした……。'] },
    /* 「覚えた気がする」と言っていないのに正解：宣言なしで覚えていたので、しっかり褒める（先生の落ち着いた口調のまま） */
    ok:{ t:['正解です。何も言わずに覚えていたんですね。これは立派です。',
            '正解。宣言もなしに、きちんと身についている。いちばん良い覚え方です。',
            'お見事です。自分で気づかないうちに覚えている語は、もう忘れにくいですよ。',
            '正解です。迷いのない選び方でした。よく読んできた成果ですね。',
            'その通りです。正直、ここは引っかかると思っていました。見直しました。',
            '正解。こういう語を黙って覚えているのは、本当に力がついている証拠です。',
            '素晴らしい。「覚えた気がする」と言わないほうが覚えている、というのは面白いですね。',
            '正解です。これはもう、KANTAくんの語と言っていいでしょう。'],
         k:['よし！', 'これは分かりました！', 'やった、正解！', 'ふう、合ってた。', '余裕です（たぶん）。'] },
    ng:{ t:['残念、違います。', '惜しい……いえ、違います。', 'そこは引っかかりやすいところです。', '違います。でも、ここで間違えたら覚えられます。', 'ううん、違いますね。'],
         k:['あっ……そっちでしたか。', 'くやしい……！', '覚えたつもりだったのに……。', '次は間違えません。', 'えっ、そうなんですか。'] }
  };
  var CT=null;
  function ctStop(){ if(CT){ CT.timers.forEach(clearTimeout); CT=null; } }
  /* 1文に穴1つの問題を作る。穴の語句は cloze.json から（説明文に1回だけ出る語句） */
  function ctQuestion(c){
    var b=c.body, cand=shuffle((CLOZE[c.id]||[]).filter(function(t){ var i=b.indexOf(t); return i>=0 && b.indexOf(t, i+1)<0; }));
    var t=cand[0]; if(!t) return null;
    var a=b.indexOf(t), sent=sentenceAt(b, a), j=sent.indexOf(t);
    var opts=shuffle([t].concat(decoys(c, [t], {}, 3)));
    return { t:t, html:esc(sent.slice(0, j))+'<span class="blank">'+esc(t)+'</span>'+esc(sent.slice(j+t.length)), opts:opts };
  }
  function startCollTest(){
    ctStop();
    var own=APPROVED.filter(function(c){ return S.owned[c.id] && ctQuestion(c); });
    if(!own.length) return;
    var claimed=shuffle(own.filter(function(c){ return S.owned[c.id].claim; }));   /* 押した語の中の順番もランダム */
    var rest=shuffle(own.filter(function(c){ return !S.owned[c.id].claim; }));
    /* 押した語は5問のうち4問まで。残りは押していない語から（足りなければ押した語で埋める） */
    var take=claimed.slice(0,4), more=rest.slice(0,5-take.length);
    var items=take.concat(more), extra=claimed.slice(4).concat(rest.slice(more.length));
    items=items.concat(extra.slice(0,5-items.length));
    CT={ items:items, i:0, got:0, toNormal:[], toKira:[], timers:[] };
    var log=$('ctLog'); log.innerHTML=''; $('ctN').textContent='';
    show('ctest'); $('ctest').scrollTop=0;
    var intro='コレクションから'+items.length+'問出します。説明文の空いているところに入る語句を選んでください。'
      +(take.length ? '\nまずは「覚えた気がする」と言っていた語からいきますよ。' : '');
    var run=CT;
    talk(log, 't', esc(intro), 900, run.timers).then(function(){ if(CT===run) ctAsk(); });
  }
  function ctAsk(){
    var run=CT, c=run.items[run.i], log=$('ctLog'), q=ctQuestion(c);
    $('ctN').textContent=(run.i+1)+' / '+run.items.length;
    var html=esc('第'+(run.i+1)+'問。《'+c.term+'》の説明から。空いているところに入るのは？')+'<span class="sentq">'+q.html+'</span>';
    talk(log, 't', html, 1000, run.timers).then(function(){
      if(CT!==run) return;
      log.insertAdjacentHTML('beforeend', '<div class="ct-opts">'+q.opts.map(function(x){
        return '<button type="button" class="ct-opt">'+esc(x)+'</button>';
      }).join('')+'</div>');
      var box=log.lastElementChild; scrollEnd(box);
      box.addEventListener('click', function(e){
        var b=e.target.closest('.ct-opt'); if(!b || CT!==run) return;
        var x=b.textContent;
        box.remove();
        log.insertAdjacentHTML('beforeend', bubbleHTML('k', esc(x), 'new')); scrollEnd(log.lastElementChild);
        ctJudge(c, x===q.t, q.t);
      });
    });
  }
  function ctJudge(c, right, answer){
    var run=CT, log=$('ctLog'), o=S.owned[c.id];
    var lines=CT_LINES[(o.claim ? 'claim' : '')+(right ? (o.claim ? 'Ok' : 'ok') : (o.claim ? 'Ng' : 'ng'))];
    if(right){
      run.got++; S.points++;
      if(o.kira){ o.kira=false; o.learned=Date.now(); run.toNormal.push(c.term); }
    }else{
      if(!o.kira){ o.kira=true; run.toKira.push(c.term); }
      delete o.learned;
    }
    delete o.claim; save();
    var t=pick(lines.t)+(right ? '' : '\n正解は「'+answer+'」です。');
    talk(log, 't', esc(t), 1300, run.timers)
      .then(function(){ return CT===run && talk(log, 'k', esc(pick(lines.k)), 1000, run.timers); })
      .then(function(){
        if(CT!==run) return;
        run.i++;
        if(run.i<run.items.length){ ctAsk(); return; }
        ctEnd();
      });
  }
  function ctEnd(){
    var run=CT, log=$('ctLog');
    var t='今日はここまで。'+run.items.length+'問中'+run.got+'問正解で、+'+run.got+'ポイントです（いま '+S.points+'ポイント）。'
      +(run.toNormal.length ? '\nキラ → ノーマル：'+run.toNormal.join('、') : '')
      +(run.toKira.length ? '\nノーマル → キラ：'+run.toKira.join('、') : '');
    talk(log, 't', esc(t), 1200, run.timers).then(function(){
      if(CT!==run) return;
      $('ctN').textContent='';
      log.insertAdjacentHTML('beforeend', '<button type="button" class="btn primary ct-end">コレクションに戻る</button>');
      var b=log.lastElementChild; scrollEnd(b);
      b.addEventListener('click', ctClose);
    });
  }
  function ctClose(){ ctStop(); renderCollection(); show('collection'); }
  $('ctBtn').addEventListener('click', startCollTest);
  $('ctClose').addEventListener('click', ctClose);

  /* =====================================================
     7. 穴埋め：説明全文から5か所を抜き、下の選択肢を指で穴へ運ぶ
        穴の候補は cloze.json（語ごとに確かめた、まとまりのある語句）。毎回ランダムに5つ選ぶ。
        説明文に2回以上出る語句は、片方が答えになってしまうので使わない。穴どうしは2字以上離す
     ===================================================== */
  var CLOZE={}, CZ=null, CZ_N=5, CZ_DECOY=5;
  /* 誤答：正解と同じ種類（年／カタカナ語／そのほか）で字数の近い語句を、つながり先の語の候補から選ぶ。
     足りなければ同じ出題区分の語から。この説明文に出てくる語句は、消去法ですぐ外せるので使わない */
  function czKind(t){ return /^\d{4}(年代)?$/.test(t) ? 'y' : /^[ァ-ヺー・＝]+$/.test(t) ? 'k' : 'o'; }
  function decoys(c, answers, src, want){
    want=want||CZ_DECOY;
    var b=c.body, seen={}, near=[], far=[];
    answers.forEach(function(t){ seen[t]=1; });
    function take(list, x){ (CLOZE[x.id]||[]).forEach(function(t){ if(!seen[t] && b.indexOf(t)<0){ seen[t]=1; src[t]=x.id; list.push(t); } }); }
    (c.links||[]).forEach(function(l){ var x=BYID[resolve(l)]; if(x && x.id!==c.id) take(near, x); });
    shuffle(APPROVED.filter(function(x){ return x.id!==c.id && x.exam.kind===c.exam.kind; })).forEach(function(x){ take(far, x); });
    var pool=shuffle(near).concat(shuffle(far)), out=[];
    var order=shuffle(answers);
    for(var r=0; out.length<want && pool.length && r<want*2; r++){
      var a=order[r%order.length];
      var n=Array.from(a).length, k=czKind(a), i=-1;
      for(var tol=1; tol<=6 && i<0; tol++){
        i=pool.findIndex(function(t){ return czKind(t)===k && Math.abs(Array.from(t).length-n)<=tol; });
      }
      if(i<0) i=pool.findIndex(function(t){ return czKind(t)===k; });
      if(i<0) i=0;
      if(pool[i]){ out.push(pool[i]); pool.splice(i, 1); }
    }
    return out;
  }
  function pickHoles(c){
    var b=c.body, cand=shuffle((CLOZE[c.id]||[]).filter(function(t){
      var i=b.indexOf(t); return i>=0 && b.indexOf(t, i+1)<0;
    })), picked=[];
    cand.forEach(function(t){
      if(picked.length>=CZ_N) return;
      var a=b.indexOf(t), z=a+t.length;
      if(picked.some(function(p){ return a<p.z+2 && p.a<z+2; })) return;
      picked.push({ a:a, z:z, t:t });
    });
    return picked.sort(function(x, y){ return x.a-y.a; });
  }
  function startCloze(){
    var pool=APPROVED.filter(function(c){ return (CLOZE[c.id]||[]).length>=CZ_N; });
    var c=pool[Math.floor(Math.random()*pool.length)], holes=pickHoles(c);
    CZ={ c:c, holes:holes, sel:null, src:{}, judged:false };
    $('czTerm').textContent=c.term;
    var b=c.body, h='', at=0;
    holes.forEach(function(p, i){
      h+=esc(b.slice(at, p.a))+'<span class="hole" data-k="'+i+'" role="button" tabindex="0" aria-label="穴'+(i+1)+'" style="min-width:'+Math.max(3.2, Array.from(p.t).length*.9+.6).toFixed(1)+'em">'+(i+1)+'</span>';
      at=p.z;
    });
    $('czText').innerHTML=h+esc(b.slice(at))+'<div class="sparks"></div>';
    var answers=holes.map(function(p){ return p.t; });
    $('czChips').innerHTML=shuffle(answers.concat(decoys(c, answers, CZ.src))).map(chipHTML).join('');
    $('czMsg').textContent='10の中から5つを穴へ運び、「回答」。5つとも正しければ2ポイント';
    $('czTray').hidden=false; $('czExp').hidden=true; $('czExp').innerHTML='';
    $('czEnd').hidden=true;
    updateAnswer();
    show('cloze');
    $('cloze').scrollTop=0;
  }
  function chipHTML(t){ return '<button type="button" class="chip">'+esc(t)+'</button>'; }
  function holeNo(k){ return '穴'+(k+1); }
  /* 置く。その場では正誤を判定しない。すでに入っていた語は選択肢へ戻す */
  function tryPlace(chip, hole){
    if(!CZ || CZ.judged || !chip || !hole) return;
    if(hole.dataset.v) $('czChips').insertAdjacentHTML('beforeend', chipHTML(hole.dataset.v));
    hole.dataset.v=chip.textContent;
    hole.textContent=chip.textContent;
    hole.classList.remove('over','sel'); hole.classList.add('filled');
    hole.setAttribute('aria-label', holeNo(+hole.dataset.k)+'：'+chip.textContent+'（タップで戻す）');
    chip.remove(); CZ.sel=null;
    updateAnswer();
  }
  /* 穴に入れた語を選択肢へ戻す */
  function takeBack(hole){
    if(!CZ || CZ.judged || !hole.dataset.v) return;
    $('czChips').insertAdjacentHTML('beforeend', chipHTML(hole.dataset.v));
    delete hole.dataset.v;
    var k=+hole.dataset.k; hole.textContent=k+1; hole.classList.remove('filled'); hole.setAttribute('aria-label', holeNo(k));
    updateAnswer();
  }
  function updateAnswer(){
    var n=document.querySelectorAll('#czText .hole.filled').length;
    $('czAnswer').disabled=!CZ || CZ.judged || n<CZ.holes.length;
    $('czAnswer').textContent=n<(CZ ? CZ.holes.length : 5) ? '回答（あと'+((CZ ? CZ.holes.length : 5)-n)+'つ）' : '回答';
  }

  /* 回答：5つとも正しければ2ポイントと正解の演出。誤答があれば0ポイントで、誤答ごとの解説 */
  $('czAnswer').addEventListener('click', function(){
    if(!CZ || CZ.judged) return;
    CZ.judged=true; clearSel();
    var wrong=[];
    document.querySelectorAll('#czText .hole').forEach(function(h){
      var k=+h.dataset.k, v=h.dataset.v, t=CZ.holes[k].t;
      h.classList.remove('filled');
      if(v===t){ h.classList.add('ok'); }
      else{ wrong.push({ k:k, v:v, t:t }); h.textContent=t; h.classList.add('bad'); h.setAttribute('aria-label', holeNo(k)+'：正解は'+t+'（入れたのは'+v+'）'); }
    });
    $('czTray').hidden=true;
    if(!wrong.length){
      /* 全問正解：2ポイントと、その語のカード。持っていなければ手に入る（「知ってる」と同じ扱いでキラなし）。
         持っていれば会った回数が1つ増える */
      var c=CZ.c, own=S.owned[c.id], isNew=!own;
      if(isNew) S.owned[c.id]={ order:S.nextOrder++, first:Date.now(), met:1, kira:false };
      else own.met++;
      S.points+=2; save();
      $('czMsg').innerHTML='<div class="cz-done">全問正解</div>+2 ポイント'
        +(isNew ? '　《'+esc(c.term)+'》のカードをゲット' : '　（持っているカード。会った '+own.met+'回）')
        +'<div class="cz-get"><button type="button" class="btn" id="czSeeCard">カードを見る</button></div>';
      $('czSeeCard').addEventListener('click', function(){ showGotCard(c, false); });
      var sp=$('czText').querySelector('.sparks');
      document.querySelectorAll('#czText .hole.ok').forEach(function(h, i){
        setTimeout(function(){ h.classList.add('glow'); for(var j=0;j<8;j++) spawnSpark(sp, 1); }, 120+i*160);
      });
      /* 新しく手に入れたときは、光り終わったところでカードを表に返して見せる */
      if(isNew){ var cur=CZ; setTimeout(function(){ if(CZ===cur && current==='cloze') showGotCard(c, true); }, 120+5*160+500); }
    }else{
      /* 誤答のときもカードは見られる（手には入らない。所持・会った回数は変えない） */
      var cw=CZ.c;
      $('czMsg').innerHTML='誤答 '+wrong.length+'つ　ポイントなし'
        +'<div class="cz-get"><button type="button" class="btn" id="czSeeCard">カードを見る</button></div>';
      $('czSeeCard').addEventListener('click', function(){ showGotCard(cw, false); });
      explain(wrong);
    }
    $('czEnd').hidden=false;
  });

  /* 手に入れたカードを重ねて見せる。新しいときは裏から表へ返し、繋がりの数だけ火花を出す */
  function showGotCard(c, reveal){
    var o=S.owned[c.id], el=mountCard($('esCardStage'), c, { kira:o && o.kira, flipped:reveal, locked:reveal });
    $('esCardCap').textContent=reveal ? 'カードをゲット' : '';
    $('esCardShow').hidden=false;
    if(reveal){
      setTimeout(function(){
        el.classList.remove('flipped');
        var n=ownedNeighbors(c.id), sp=el.querySelector('.sparks');
        for(var k=0;k<Math.max(1, n);k++) setTimeout(function(){ for(var i=0;i<10;i++) spawnSpark(sp, 1); }, 300+k*180);
        if(n) setTimeout(function(){ el.querySelectorAll('.pills span.on').forEach(function(s){ s.classList.add('glow'); }); }, 350);
        setTimeout(function(){ delete el.dataset.locked; }, 700);
      }, 250);
    }
    $('esCardClose').focus({ preventScroll:true });
  }

  /* 説明文を文に分け、位置 pos を含む文を返す */
  function sentenceAt(text, pos){
    var a=text.lastIndexOf('。', pos-1)+1, z=text.indexOf('。', pos);
    return text.slice(a, z<0 ? text.length : z+1);
  }
  function mark(sent, word){
    var i=sent.indexOf(word);
    return i<0 ? esc(sent) : esc(sent.slice(0, i))+'<b>'+esc(word)+'</b>'+esc(sent.slice(i+word.length));
  }
  /* 解説A：カードのデータだけで、正しい語の入る文と、入れた語がどこの語かを示す */
  function explain(wrong){
    var c=CZ.c, html='';
    wrong.forEach(function(w){
      var p=CZ.holes[w.k], other=CZ.holes.findIndex(function(h){ return h.t===w.v; });
      html+='<div class="it"><h4>'+holeNo(w.k)+'：<s>'+esc(w.v)+'</s> → 「'+esc(w.t)+'」</h4>'
        +'<p>'+mark(sentenceAt(c.body, p.a), w.t)+'</p>';
      if(other>=0){
        var so=sentenceAt(c.body, CZ.holes[other].a);
        html+='<p>「'+esc(w.v)+'」は'+holeNo(other)+'に入る語。</p>'+(so===sentenceAt(c.body, p.a) ? '' : '<small>'+mark(so, w.v)+'</small>');
      }else{
        var x=BYID[CZ.src[w.v]];
        if(x){
          var i=x.body.indexOf(w.v);
          html+='<p>「'+esc(w.v)+'」は《'+esc(x.term)+'》の説明に出てくる語。</p><small>'+mark(sentenceAt(x.body, i<0 ? 0 : i), w.v)+'</small>';
        }
      }
      html+='</div>';
    });
    html+='<div class="cz-chat-h">KANTAくんとして Claude先生に聞く</div>'+chatBoxHTML();
    $('czExp').innerHTML=html; $('czExp').hidden=false;
    CZ.wrong=wrong;
    /* 先生には、問題のカードに加えて、誤答の語が出てくるカードとまちがえた穴の一覧を前提として渡す。会話は残さない */
    var srcIds={};
    wrong.forEach(function(w){ if(CZ.src[w.v]) srcIds[CZ.src[w.v]]=1; });
    var extra='\n\n【穴埋め問題の結果】\n上の用語カードの説明文から5か所を穴にした問題で、KANTAくんは次の穴をまちがえた。'
      +'なぜその語ではなく正解が入るのかを、文脈と語の意味から説明する。まちがいが複数あるときは「穴1は〜」のように穴ごとに触れてよく、その場合は全体で300字以内でよい。\n'
      +wrong.map(function(w){ return holeNo(w.k)+'：入れた語「'+w.v+'」、正解「'+w.t+'」'; }).join('\n')
      +Object.keys(srcIds).map(function(id){ return '\n\n【誤答の語が出てくるカード】\n'+cardContext(BYID[id]); }).join('');
    var w0=wrong[0];
    bindChat($('czExp').querySelector('.chat'), c, { seed:[], save:false, extra:extra,
      draft:'先生、'+holeNo(w0.k)+'に「'+w0.v+'」を入れたんですけど、なんでちがうんですか'+(wrong.length>1 ? '？ほかの穴も' : '') });
    renderNet();
  }

  function clearSel(){
    document.querySelectorAll('#cloze .sel').forEach(function(x){ x.classList.remove('sel'); });
    if(CZ) CZ.sel=null;
  }

  /* 指で運ぶ。少し動いたらドラッグ、動かずに離したらタップ（選ぶ） */
  (function(){
    var drag=null;
    function holeAt(x, y){ var el=document.elementFromPoint(x, y); return el && !(CZ && CZ.judged) && el.closest('#czText .hole'); }
    $('czChips').addEventListener('pointerdown', function(e){
      var chip=e.target.closest('.chip'); if(!chip) return;
      drag={ chip:chip, x0:e.clientX, y0:e.clientY, ghost:null, over:null, id:e.pointerId };
      try{ chip.setPointerCapture(e.pointerId); }catch(err){}
    });
    $('czChips').addEventListener('pointermove', function(e){
      if(!drag || e.pointerId!==drag.id) return;
      if(!drag.ghost){
        if(Math.hypot(e.clientX-drag.x0, e.clientY-drag.y0)<8) return;
        clearSel();
        var g=drag.chip.cloneNode(true); g.classList.add('chip-ghost'); document.body.appendChild(g);
        drag.ghost=g; drag.chip.classList.add('lift');
      }
      drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=e.clientY+'px';
      /* 画面の上端に近づいたら文章をスクロールして、上の穴へも運べるように */
      var sc=$('cloze'); if(e.clientY<90) sc.scrollTop-=10; else if(e.clientY>innerHeight-40) sc.scrollTop+=10;
      var h=holeAt(e.clientX, e.clientY);
      if(h!==drag.over){ if(drag.over) drag.over.classList.remove('over'); if(h) h.classList.add('over'); drag.over=h; }
      e.preventDefault();
    });
    function end(e){
      if(!drag || e.pointerId!==drag.id) return;
      var d=drag; drag=null;
      if(d.over) d.over.classList.remove('over');
      if(d.ghost){
        d.ghost.remove(); d.chip.classList.remove('lift');
        if(e.type==='pointerup') tryPlace(d.chip, holeAt(e.clientX, e.clientY));
      }else if(e.type==='pointerup'){
        var was=d.chip.classList.contains('sel'); clearSel();
        if(!was){ d.chip.classList.add('sel'); CZ.sel=d.chip; }
      }
    }
    $('czChips').addEventListener('pointerup', end);
    $('czChips').addEventListener('pointercancel', end);
    /* キーボード：Enter で選ぶ */
    $('czChips').addEventListener('keydown', function(e){
      var chip=e.target.closest('.chip'); if(!chip || (e.key!=='Enter' && e.key!==' ')) return;
      e.preventDefault(); var was=chip.classList.contains('sel'); clearSel();
      if(!was){ chip.classList.add('sel'); CZ.sel=chip; }
    });
  })();
  /* 穴のタップ：選んだ選択肢があれば入れる（入っていれば入れ替え）、なければ入っている語を戻す */
  function holeTap(e){
    var h=e.target.closest('.hole'); if(!h || !CZ || CZ.judged) return;
    if(e.type==='keydown' && e.key!=='Enter' && e.key!==' ') return;
    e.preventDefault();
    if(CZ.sel) tryPlace(CZ.sel, h); else takeBack(h);
  }
  $('czText').addEventListener('click', holeTap);
  $('czText').addEventListener('keydown', holeTap);
  $('clozeBtn').addEventListener('click', startCloze);
  $('czNext').addEventListener('click', function(){ closeEssayCard(); startCloze(); });
  $('czHome').addEventListener('click', function(){ CZ=null; closeEssayCard(); show('home'); });
  $('clozeClose').addEventListener('click', function(){ CZ=null; closeEssayCard(); show('home'); });

  /* =====================================================
     6. 記述練習：124語からランダムに1語、300字で説明 → 3観点の指摘と「次に足すなら」
        模範解答や書き直しは出さない。答案と指摘は bunka:essays に残す
     ===================================================== */
  var ESSAYS='bunka:essays', ESSAY_LEN=300, ASPECTS=['定義の正確さ','事実（制度・年代・人名など）','つながり'];
  function loadEssays(){ try{ var a=JSON.parse(localStorage.getItem(ESSAYS)); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function saveEssays(a){ try{ localStorage.setItem(ESSAYS, JSON.stringify(a)); }catch(e){} }

  var E=null;
  function essayLen(t){ return Array.from(t.replace(/\s/g,'')).length; }
  function startEssay(){
    (apiKey() ? Promise.resolve(true) : askKey()).then(function(ok){
      renderNet();
      if(!ok) return;
      E={ c:APPROVED[Math.floor(Math.random()*APPROVED.length)], busy:false, done:false, aids:{ hint:false, card:false } };
      $('esHint').hidden=true; $('esHint').innerHTML=''; $('esHintBtn').setAttribute('aria-expanded','false'); $('esHintBtn').textContent='ヒントをみる';
      closeEssayCard();
      $('esQ').innerHTML='<b>'+esc(E.c.term)+'</b><span>について'+ESSAY_LEN+'字で説明せよ</span>';
      var ta=$('esText'); ta.value=''; ta.readOnly=false;
      $('esOut').innerHTML=''; $('esEnd').hidden=true; $('esSend').hidden=false;
      countEssay();
      show('essay');
      ta.focus({preventScroll:true});
    });
  }
  /* 見ながら書いて覚える：ヒント（使いどころ・つながり・図）と、カードそのもの（長押しで説明全文） */
  $('esHintBtn').addEventListener('click', function(){
    if(!E) return;
    var box=$('esHint'), open=box.hidden;
    if(open && !box.innerHTML){
      var c=E.c;
      box.innerHTML='<div><i>使いどころ</i><p>'+esc(c.usage)+'</p></div>'
        +'<div><i>つながり</i><p>'+(c.links||[]).map(esc).join('、')+'</p></div>'
        +(c.figure && c.figure.status==='approved' ? '<div>'+Figure.svg(c.figure)+'</div>' : '');
    }
    box.hidden=!open;
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
    this.textContent=open ? 'ヒントを閉じる' : 'ヒントをみる';
    if(open) E.aids.hint=true;
  });
  $('esCardBtn').addEventListener('click', function(){
    if(!E) return;
    var o=S.owned[E.c.id];
    mountCard($('esCardStage'), E.c, { kira:o && o.kira });
    $('esCardShow').hidden=false;
    E.aids.card=true;
    $('esCardClose').focus({ preventScroll:true });
  });
  function closeEssayCard(){ $('esCardShow').hidden=true; $('esCardStage').innerHTML=''; $('esCardCap').textContent=''; }
  $('esCardClose').addEventListener('click', closeEssayCard);
  $('esCardShow').addEventListener('click', function(e){ if(e.target===this) closeEssayCard(); });

  function countEssay(){
    var n=essayLen($('esText').value), el=$('esCount');
    el.textContent=n+' / '+ESSAY_LEN+'字';
    el.classList.toggle('over', n>ESSAY_LEN);
    var off=!online();
    $('esSend').disabled=off || !E || E.busy || E.done || n<1;
    $('esSend').textContent=off ? '圏外' : '送る';
  }
  /* 日本語入力の確定で input が来ない環境もあるので、確定とキー操作でも数え直す */
  ['input','compositionend','keyup','change'].forEach(function(ev){ $('esText').addEventListener(ev, countEssay); });

  function essaySystem(c){
    return 'あなたは東京大学大学院（文化資源学）の入試に向けて記述を練習する人の答案を見る。'
      +'設問は「'+c.term+'について'+ESSAY_LEN+'字で説明せよ」。下の用語カード（承認済み）を基準にする。\n\n'
      +'答案を次の3観点で見て、観点ごとに指摘を1つずつ書く（各80字以内）。\n'
      +'1. 定義の正確さ\n2. 事実（制度・年代・人名など）\n3. つながり（関連語への言及があるか）\n'
      +'加えて「次に足すなら」を1つ書く（80字以内）。\n\n'
      +'守ること：模範解答を書かない。答案の全文や段落を書き直さない。点数や合否を付けない。'
      +'カードにない事実で答案を誤りと断定しない。指摘は答案の具体的な箇所に触れる。\n\n'
      +'出力は次の JSON だけ（前後に何も書かない）：\n'
      +'{"points":[{"aspect":"定義の正確さ","comment":"…"},{"aspect":"事実","comment":"…"},{"aspect":"つながり","comment":"…"}],"next":"…"}\n\n'
      +'【用語カード】\n'+cardContext(c);
  }
  /* JSON を取り出す。```json の囲みや前後の文が付いていても拾う */
  function parseReview(text){
    var i=text.indexOf('{'), j=text.lastIndexOf('}');
    if(i<0 || j<i) return null;
    try{
      var d=JSON.parse(text.slice(i, j+1));
      if(!Array.isArray(d.points) || !d.points.length) return null;
      return {
        points:d.points.slice(0,3).map(function(p, k){ return { aspect:ASPECTS[k], comment:String(p && p.comment || '') }; }),
        next:String(d.next || '')
      };
    }catch(e){ return null; }
  }
  function renderReview(r){
    $('esOut').innerHTML=r.points.map(function(p){
      return '<div class="es-pt"><i>'+esc(p.aspect)+'</i>'+esc(p.comment)+'</div>';
    }).join('')+(r.next ? '<div class="es-pt next"><i>次に足すなら</i>'+esc(r.next)+'</div>' : '');
  }

  $('esSend').addEventListener('click', function(){
    if(!E || E.busy || E.done || !online()) return;
    var answer=$('esText').value.trim();
    if(essayLen(answer)<1) return;
    var c=E.c, cur=E;
    E.busy=true; countEssay(); $('esText').readOnly=true;
    $('esOut').innerHTML='<div class="es-msg">見ています…</div>';
    callClaude(essaySystem(c), '答案：\n'+answer).then(function(text){
      if(E!==cur) return;
      var r=parseReview(text);
      if(!r){ r={ points:[{ aspect:'指摘', comment:text }], next:'' }; }
      renderReview(r);
      var log=loadEssays();
      log.push({ id:c.id, term:c.term, at:Date.now(), answer:answer, points:r.points, next:r.next, aids:cur.aids });
      saveEssays(log);
      E.done=true; $('esSend').hidden=true; $('esEnd').hidden=false;
    }, function(err){
      if(E!==cur) return;
      $('esText').readOnly=false;
      $('esOut').innerHTML='<div class="es-msg err">'+esc(
        err.status==='refusal' ? err.message : err.status===401 ? '鍵が正しくないようです。コレクション画面の「鍵を消す」から入れ直してください。'
        : err.status ? 'うまく返りませんでした（'+err.status+'：'+err.message+'）。もう一度送れます'
        : '通信できませんでした。もう一度送れます')+'</div>';
    }).then(function(){ if(E===cur){ E.busy=false; countEssay(); } });
  });
  $('essayBtn').addEventListener('click', startEssay);
  $('esNext').addEventListener('click', startEssay);
  $('esHome').addEventListener('click', function(){ E=null; closeEssayCard(); show('home'); });
  $('essayClose').addEventListener('click', function(){
    if(E && !E.done && essayLen($('esText').value) && !confirm('書いた答案を捨ててホームへ戻ります')) return;
    E=null; closeEssayCard(); show('home');
  });
  $('quizClose').addEventListener('click', function(){ Q=null; $('qShow').classList.remove('on'); show('home'); });
  $('quizEndHome').addEventListener('click', function(){ show('home'); });

  /* =====================================================
     起動
     ===================================================== */
  S=load();
  Promise.all([
    fetch('cards.json').then(function(r){ return r.json(); }),
    fetch('aliases.json').then(function(r){ return r.json(); }),
    fetch('cloze.json').then(function(r){ return r.json(); }).catch(function(){ return {}; }),
    fetch('dialogues.json').then(function(r){ return r.json(); }).catch(function(){ return {}; })
  ]).then(function(res){
    CARDS=res[0]; ALIASES=res[1]; CLOZE=res[2]||{}; DIALOGS=res[3]||{};
    CARDS.forEach(function(c){ BYID[c.id]=c; });
    buildNeighbors();
    APPROVED=CARDS.filter(function(c){ return c.status==='approved'; });
    /* 承認が取り消された語が開封途中のパックにあれば外す */
    if(S.pending){
      S.pending.cards=S.pending.cards.filter(function(e){ return BYID[e.id]; });
      if(!S.pending.cards.length || S.pending.idx>=S.pending.cards.length) S.pending=null;
    }
    save();
    show('home');
  });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && current==='home') renderHome(); });

  /* オフライン用（PWA） */
  if('serviceWorker' in navigator && location.protocol!=='file:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
  }
})();
</script>
</body>
</html>
