<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pocket用語カード</title>
<meta name="theme-color" content="#2f5f9e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pocket用語カード">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="figure.css">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e4dfd1; --bgdot:#cfc8b6; --ink:#1d1b16; --muted:#6c675c; --hint:#8a8477;
  --face:#f8f4ea; --face2:#efe9da; --line:#dcd4c2;
  --frame:#2f5f9e; --frame2:#1f4273; --gold:#c89b3c; --teal:#1D9E75; --teal2:#9FE1CB; --purple:#7F77DD;
  --red:#d33b2f;
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#151b1d; --bgdot:#22302e; --hint:#7d877f; }
}
:root[data-theme="dark"]{ --bg:#151b1d; --bgdot:#22302e; --hint:#7d877f; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; height:100%; background:var(--bg);
  background-image:radial-gradient(var(--bgdot) 1px, transparent 1.2px);
  background-size:18px 18px;
  font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  color:var(--ink); display:flex; flex-direction:column; align-items:center; justify-content:center;
  overflow:hidden;
}
/* 文字は基本的に選んでコピーできる。タップ・長押し・なぞる操作を持つもの（カード・パック・ボタン）だけ選べなくする */
.card, .pack, .tear-wrap, .tile, .btn, .link, .x, .vlinks button, .q-show{
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.stage{ perspective:1400px; position:relative; }
.card{
  --p:0;
  position:relative; width:min(78vw,300px); aspect-ratio:63/88;
  transform-style:preserve-3d; cursor:pointer; touch-action:none;
  transition:transform .7s cubic-bezier(.2,.8,.2,1);
}
.card.flipped{ transform:rotateY(180deg); }
.card.press{ transition:transform .15s ease-out; transform:scale(calc(1 + var(--p)*.05)) rotate(calc(var(--p)*var(--p)*1deg)); }
.card.burst{ transition:transform .55s cubic-bezier(.3,0,.1,1), opacity .5s ease; transform:scale(1.18); opacity:0; }
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:14px; overflow:hidden;
  border:3px solid var(--frame);
  box-shadow:inset 0 0 0 4px var(--face), inset 0 0 0 5px var(--gold),
             0 18px 40px -18px rgba(0,0,0,.55);
  background:var(--face);
}
.face.back{ transform:rotateY(180deg); background:#f3eee2; }
/* charge ring + glow */
.card::before{
  content:""; position:absolute; inset:-9px; border-radius:22px; pointer-events:none;
  background:conic-gradient(from -90deg, var(--gold), var(--purple) calc(var(--p)*360deg), transparent 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  mask:radial-gradient(farthest-side, transparent calc(100% - 5px), #000 calc(100% - 4px));
  opacity:calc(var(--p)*1.2); z-index:3;
  transform:translateZ(1px);
}
.card::after{
  content:""; position:absolute; inset:-2px; border-radius:16px; pointer-events:none;
  box-shadow:0 0 calc(10px + var(--p)*60px) calc(var(--p)*14px) rgba(127,119,221,calc(.05 + var(--p)*.55));
  z-index:-1;
}
.sheen{
  position:absolute; inset:0; pointer-events:none; mix-blend-mode:soft-light; z-index:2;
  background:linear-gradient(112deg, transparent 38%, rgba(255,255,255,.95) 50%, transparent 62%);
  background-size:280% 100%; background-position:120% 0; opacity:.85;
}
.card.press .sheen{ animation:sheen .9s linear infinite; }
@keyframes sheen{ from{ background-position:120% 0 } to{ background-position:-120% 0 } }
/* sparks */
.sparks{ position:absolute; inset:-30px; pointer-events:none; overflow:visible; z-index:4; }
.spark{
  position:absolute; bottom:10%; width:6px; height:6px; border-radius:50%;
  background:#CECBF6; box-shadow:0 0 8px 2px rgba(127,119,221,.7);
  animation:rise var(--d) cubic-bezier(.2,.6,.3,1) forwards;
}
@keyframes rise{ 0%{ transform:translate(0,0) scale(.4); opacity:0 } 15%{ opacity:1 } 100%{ transform:translate(var(--dx), calc(var(--dy)*-1)) scale(1.1); opacity:0 } }

/* front content（bunka） */
.front{ padding:18px 16px 12px; display:flex; flex-direction:column; gap:10px; container-type:inline-size; }
.meta{ display:flex; align-items:center; gap:8px; min-width:0; }
.badge{ font-size:11px; line-height:1; padding:4px 8px; border-radius:10px; white-space:nowrap; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
.badge.k{ background:linear-gradient(135deg,#e3c178,#c89b3c 55%,#b3862c); color:#2e2104; box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); }
.badge.s{ background:#e6e1d5; color:var(--muted); }
.meta small{ font-size:10.5px; color:var(--hint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
.main{ margin:auto 0; display:flex; flex-direction:column; gap:min(14px, 4cqw); }
/* 用語：--w は長い方の行の幅（全角=1） */
.term{
  margin:0; font-family:var(--mincho); font-weight:600; line-height:1.18; white-space:nowrap;
  font-size:min(40px, calc(100cqw / (var(--w) + .3)));
}
.term.two{ font-size:min(30px, calc(100cqw / (var(--w) + .3))); }
.cfig{ margin:-2px 0 0; }   /* 図示（承認済みのみ）。使いどころの下、つながりの上 */
/* 図のある表面は詰める（図の枠の高さは固定なので、まわりを削る） */
.front.hasfig{ padding-top:14px; gap:7px; }
.front.hasfig .main{ gap:min(9px, 3cqw); }
.front.hasfig .term{ font-size:min(34px, calc(100cqw / (var(--w) + .3))); }
.front.hasfig .term.two{ font-size:min(26px, calc(100cqw / (var(--w) + .3))); }
.front.hasfig .usage{ font-size:min(14px, 5.5cqw); line-height:1.65; padding-top:8px; }
.front.hasfig .links > span{ display:none; }
.front.hasfig .pills{ flex-wrap:nowrap; min-width:0; }
.front.hasfig .pills span{ flex:0 1 auto; min-width:0; }
.usage{ font-size:min(15.5px, 6.1cqw); line-height:1.85; color:var(--ink); border-top:1px solid var(--line); padding-top:12px; margin:0; }
.links{ display:flex; flex-direction:column; gap:6px; }
.links > span{ font-size:10.5px; color:var(--hint); letter-spacing:.1em; }
.pills{ display:flex; gap:5px; flex-wrap:wrap; }
.pills span{ font-size:11px; padding:3px 9px; border-radius:11px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pills span.on{ background:var(--frame); color:#fff; }
.pills span.off{ border:1px dashed #cfc7b4; color:#b1aa9a; padding:2px 8px; }
.foot{ display:flex; justify-content:space-between; font-size:10.5px; color:var(--hint); border-top:1px solid var(--line); padding-top:7px; }
.foot i{ font-style:normal; color:var(--gold); letter-spacing:2px; }

/* back */
.back svg{ width:100%; height:100%; display:block; }

/* etymology face */
.etym{
  position:fixed; inset:0; z-index:20; background:var(--face);
  color:var(--ink); padding:calc(env(safe-area-inset-top,0px) + 28px) 26px calc(env(safe-area-inset-bottom,0px) + 24px);
  clip-path:circle(0 at var(--cx,50%) var(--cy,50%)); visibility:hidden;
  display:flex; flex-direction:column; overflow-y:auto;
}
.etym.show{ visibility:visible; clip-path:circle(160% at var(--cx,50%) var(--cy,50%)); transition:clip-path .75s cubic-bezier(.2,.7,.1,1); }
.etym.hide{ visibility:visible; clip-path:circle(0 at var(--cx,50%) var(--cy,50%)); transition:clip-path .5s cubic-bezier(.6,0,.8,.3), visibility 0s .5s; }
.etym h1{ font-family:var(--mincho); font-weight:600; font-size:44px; margin:0 0 26px; letter-spacing:.01em; line-height:1.2; max-width:15em; text-wrap:balance; }
.etym h1.l{ font-size:30px; }
.etym p{ font-size:15.5px; line-height:1.9; margin:0 0 18px; max-width:34em; text-align:justify; }
.etym .src{ margin-top:auto; font-size:11px; color:var(--hint); display:flex; justify-content:flex-end; align-items:center; }
.etym button{
  appearance:none; border:1px solid var(--line); background:transparent; color:var(--muted);
  font:inherit; font-size:13px; padding:8px 16px; border-radius:20px;
}
.etym button:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
/* 写真（長押し面の説明文の上）。読み込み中も説明文はそのまま出す */
.ph{ margin:0 0 20px; max-width:34em; }
.ph img{ display:block; width:100%; height:auto; border-radius:8px; background:var(--face2); }
.ph.fail img{ display:none; }
.ph figcaption{ margin-top:6px; font-size:12px; color:var(--muted); line-height:1.5; }
.ph figcaption a{ display:block; margin-top:2px; font-size:10.5px; color:var(--hint); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:2px; word-break:break-all; }
/* この語について聞く（長押し面の下に小さく） */
.chat{ margin:4px 0 22px; max-width:34em; background:#eef1ea; border-radius:14px; padding:12px 10px 10px; }
.chat-log{ display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.chat-log:empty{ display:none; }
.chat-hint{ font-size:11.5px; color:var(--hint); text-align:center; margin:-2px 0 8px; }
.chat-tools{ display:flex; justify-content:flex-end; margin:-4px 0 6px; }
.chat-tools[hidden]{ display:none; }
.etym .chat .chat-tools button{ background:none; border:0; color:var(--hint); font-size:11.5px; padding:2px 4px; text-decoration:underline; text-underline-offset:2px; }
.msg{ display:flex; align-items:flex-end; gap:7px; }
.msg.k{ flex-direction:row-reverse; }
.msg .av{ flex:none; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; background:#fff; }
.msg.t .av{ border:2px solid #9a9a9a; color:#6b6b6b; font-family:var(--mincho); }
.msg.k .av{ border:2px solid #2e9d5a; color:#1f7a44; }
.msg .who{ display:block; font-size:10.5px; color:var(--hint); margin:0 4px 2px; }
.msg.k .who{ text-align:right; }
.msg .bub{ max-width:78%; }
.msg p{ margin:0; padding:8px 12px; border-radius:16px; font-size:14.5px; line-height:1.7; white-space:pre-wrap; word-break:break-word; }
.msg.t p{ background:#fff; color:var(--ink); border-bottom-left-radius:4px; }
.msg.k p{ background:#a8e6a0; color:#14321b; border-bottom-right-radius:4px; }
.msg.err p{ background:#fbe7e4; color:#7a1f17; font-size:13px; }
.msg.typing p{ color:var(--hint); letter-spacing:.2em; }
@media (prefers-reduced-motion:no-preference){ .msg.typing p{ animation:breathe 1.2s ease-in-out infinite; } .msg.new{ animation:fg-in .25s ease-out; } }
.chat form{ display:flex; gap:8px; align-items:center; }
.chat input{ flex:1; min-width:0; font:inherit; font-size:16px; padding:8px 14px; border-radius:20px; border:1px solid var(--line); background:#fff; color:var(--ink); }
.chat input:focus-visible{ outline:2px solid #2e9d5a; outline-offset:1px; }
.etym .chat button{ flex:none; font-size:13px; padding:8px 14px; background:#2e9d5a; border-color:#2e9d5a; color:#fff; }
.chat.nokey button, .etym .chat button:disabled{ color:var(--hint); background:var(--face2); border-color:var(--line); border-style:dashed; }
/* 鍵の入力 */
.keydlg{ border:0; border-radius:16px; padding:22px 20px 18px; width:min(92vw,360px); background:var(--face); color:var(--ink); box-shadow:0 20px 50px -20px rgba(0,0,0,.6); }
.keydlg::backdrop{ background:rgba(20,22,20,.55); }
.keydlg h3{ margin:0 0 8px; font-size:16px; }
.keydlg p{ margin:0 0 14px; font-size:12.5px; line-height:1.7; color:var(--muted); }
.keydlg input{ width:100%; font:inherit; font-size:16px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); background:#fff; color:var(--ink); }
.keydlg .row2{ display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
.keydlg .btn{ font-size:14px; padding:9px 18px; }
.flash{ position:fixed; inset:0; background:#fff; pointer-events:none; opacity:0; z-index:19; }
.flash.go{ animation:flash .55s ease-out; }
@keyframes flash{ 0%{opacity:0} 18%{opacity:.95} 100%{opacity:0} }

.hint{ margin-top:22px; font-size:12px; color:var(--hint); text-align:center; line-height:1.6; }
@media (prefers-reduced-motion:reduce){
  .card, .card.press, .etym.show, .etym.hide{ transition:none } .spark{ display:none } .flash.go{ animation:none }
}

/* ===== アプリ画面 ===== */
:root{ --onbg:#1d1b16; --onbg2:#6c675c; }
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --onbg:#ece6d8; --onbg2:#9aa39b; }
}
:root[data-theme="dark"]{ --onbg:#ece6d8; --onbg2:#9aa39b; }

.screen{
  position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);
  color:var(--onbg);
}
.screen.on{ display:flex; }
.btn{
  appearance:none; border:1px solid var(--line); background:var(--face); color:var(--ink);
  font:inherit; font-size:15px; padding:11px 26px; border-radius:24px; cursor:pointer;
  box-shadow:0 6px 18px -10px rgba(0,0,0,.4);
}
.btn.primary{ background:var(--frame); border-color:var(--frame); color:#fff; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn:focus-visible, .link:focus-visible, .tile:focus-visible, .pack:focus-visible, .x:focus-visible{ outline:2px solid var(--teal); outline-offset:3px; }
.link{ appearance:none; border:0; background:none; font:inherit; font-size:13px; color:var(--onbg2); padding:8px; cursor:pointer; }
.x{
  position:absolute; top:calc(env(safe-area-inset-top,0px) + 12px); left:12px;
  appearance:none; border:0; background:none; font-size:26px; line-height:1; color:var(--onbg2); padding:8px 12px; cursor:pointer;
}

/* パック：ゲージは中の光の水位 */
.pack{
  --g:0;
  position:relative; width:min(58vw,220px); aspect-ratio:63/100; border-radius:10px; overflow:hidden;
  background:linear-gradient(160deg, #3a6fb0 0%, #2f5f9e 45%, #1f4273 100%);
  box-shadow:inset 0 0 0 5px rgba(255,255,255,.06), inset 0 0 0 6px var(--gold), 0 22px 44px -20px rgba(0,0,0,.6);
  cursor:pointer; touch-action:none; transition:transform .3s ease, box-shadow .3s ease;
}
.pack::before, .pack::after{
  content:""; position:absolute; left:0; right:0; height:11px; z-index:3;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.22) 0 2px, rgba(255,255,255,.08) 2px 5px);
}
.pack::before{ top:0; } .pack::after{ bottom:0; }
.pk-fill{
  position:absolute; left:0; right:0; bottom:0; height:calc(var(--g)*100%); z-index:1;
  background:linear-gradient(to top, rgba(176,204,240,.55), rgba(176,204,240,.14));
  border-top:1px solid rgba(255,255,255,.45); transition:height .8s cubic-bezier(.2,.8,.2,1);
}
.pk-in{ position:absolute; inset:0; z-index:2; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#f6efd9; }
.pk-in svg{ width:42%; height:auto; }
.pk-title{ font-family:"Fraunces",Georgia,serif; font-style:italic; font-weight:300; font-size:22px; letter-spacing:.02em; }
.pk-sub{ font-size:11px; letter-spacing:.3em; opacity:.8; }
.pack .sheen{ z-index:2; }
.pack.ready{ box-shadow:inset 0 0 0 5px rgba(255,255,255,.06), inset 0 0 0 6px var(--gold), 0 0 34px 4px rgba(47,95,158,.45), 0 22px 44px -20px rgba(0,0,0,.6); }
@media (prefers-reduced-motion:no-preference){
  .pack.ready{ animation:bob 3.2s ease-in-out infinite; }
  .pack.ready .sheen{ animation:sheen 3.2s linear infinite; }
}
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-6px) } }
.pack.locked{ cursor:default; }

.home-status{ margin-top:22px; font-size:14px; text-align:center; line-height:1.7; min-height:3.4em; }
.home-status small{ display:block; font-size:12px; color:var(--onbg2); }
.home-quiz{ margin-top:14px; }
.home-btns{ display:flex; gap:10px; justify-content:center; }
.home-btns .btn{ padding:11px 20px; }

/* 穴埋め */
#cloze{ justify-content:flex-start; overflow-y:auto; padding-top:calc(env(safe-area-inset-top,0px) + 56px); }
/* 縦にあふれたら縮めずにスクロールさせる */
#cloze > *, #essay > *{ flex-shrink:0; }
.cz-term{ font-family:var(--mincho); font-weight:600; font-size:clamp(20px, 7vw, 28px); text-align:center; margin:8px 0 12px; text-wrap:balance; word-break:keep-all; overflow-wrap:anywhere; }
.cz-text{ width:min(100%,380px); background:var(--face); color:var(--ink); border:1px solid var(--line); border-radius:12px; padding:12px 15px; font-size:15px; line-height:1.95; text-align:left; }
.hole{ display:inline-block; min-width:3.2em; height:1.55em; line-height:1.5em; vertical-align:-.28em; margin:0 2px; padding:0 4px; border-radius:6px;
  border:1.5px dashed var(--frame); background:#eef3fa; text-align:center; color:var(--frame2); font-size:12px; transition:background .15s, border-color .15s; }
.hole.over{ background:#dbe6f5; border-style:solid; }
.hole.sel{ box-shadow:0 0 0 2px var(--gold); }
.hole.ok{ border:0; background:#fff3c4; color:var(--ink); font-size:15px; font-weight:600; min-width:0; animation:cz-pop .35s ease-out; }
.hole.ng{ animation:cz-shake .35s; border-color:var(--red); background:#fbe7e4; }
@keyframes cz-pop{ 0%{ transform:scale(.8) } 60%{ transform:scale(1.08) } 100%{ transform:none } }
@keyframes cz-shake{ 0%,100%{ transform:none } 25%{ transform:translateX(-4px) } 75%{ transform:translateX(4px) } }
.cz-chips{ width:min(100%,380px); display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:14px 0 6px; min-height:44px; }
/* 選択肢と回答ボタンは画面の下に留める（文章が長くても、穴と選択肢が同時に見える） */
.cz-tray{ position:sticky; bottom:0; z-index:2; width:min(100%,380px); display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 8px); background:linear-gradient(to bottom, rgba(0,0,0,0), var(--bg) 12px); }
.cz-tray[hidden]{ display:none; }
.cz-tray .cz-chips{ margin:0; }
.cz-answer{ min-width:9em; }
.cz-text{ position:relative; }
.cz-text .sparks{ inset:0; }
.hole.filled{ border:1.5px solid var(--frame); background:#fff; color:var(--ink); font-size:15px; min-width:0; cursor:pointer; }
.hole.bad{ border:1.5px solid var(--red); background:#fbe7e4; color:#7a1f17; font-size:15px; font-weight:600; min-width:0; }
.hole.ok.glow{ box-shadow:0 0 0 2px var(--gold), 0 0 14px 4px rgba(200,155,60,.55); }
.cz-exp{ width:min(100%,380px); display:flex; flex-direction:column; gap:10px; margin-top:6px; }
.cz-exp[hidden]{ display:none; }
.cz-exp .it{ background:var(--face); color:var(--ink); border:1px solid #e9b8b0; border-radius:12px; padding:11px 14px; font-size:13.5px; line-height:1.75; }
.cz-exp .it h4{ margin:0 0 4px; font-size:14px; }
.cz-exp .it h4 s{ color:#7a1f17; }
.cz-exp .it p{ margin:4px 0 0; }
.cz-exp .it b{ background:#fff3c4; font-weight:600; padding:0 2px; }
.cz-exp .it small{ display:block; font-size:11.5px; color:var(--muted); margin-top:4px; }
.cz-chat-h{ font-size:12.5px; color:var(--onbg2); text-align:center; margin-top:4px; }
.cz-exp .chat{ margin:0; }

<script src="figure.js"></script>
<script>
(function(){
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  /* ---- 裏面 ---- */
  function back(uid){
    var ns=uid+'-ns';
    return '<svg viewBox="0 0 300 419" xmlns="http://www.w3.org/2000/svg">'
      +'<defs>'
      +'<symbol id="'+ns+'" viewBox="0 0 40 40">'
      +'<circle cx="20" cy="20" r="15" fill="none" stroke="#d33b2f" stroke-width="3.2"/>'
      +'<rect x="9" y="17.5" width="18" height="5" rx="1" fill="#2a2621"/>'
      +'<rect x="24" y="17.5" width="5" height="5" fill="#e0893a"/>'
      +'<path d="M12 14c0-2 2-2 2-4M15 13c0-2 2-2 2-4" fill="none" stroke="#8c8577" stroke-width="1.2" stroke-linecap="round"/>'
      +'<line x1="9.5" y1="9.5" x2="30.5" y2="30.5" stroke="#d33b2f" stroke-width="3.2" stroke-linecap="round"/>'
      +'</symbol>'
      +'<pattern id="'+uid+'-tile" width="50" height="58" patternUnits="userSpaceOnUse"><use href="#'+ns+'" x="5" y="2" width="40" height="40" opacity=".92"/></pattern>'
      +'<pattern id="'+uid+'-tile2" width="50" height="58" patternUnits="userSpaceOnUse" x="25" y="29"><use href="#'+ns+'" x="5" y="2" width="40" height="40" opacity=".35"/></pattern>'
      +'</defs>'
      +'<rect width="300" height="419" fill="#f3eee2"/>'
      +'<rect width="300" height="419" fill="url(#'+uid+'-tile2)"/>'
      +'<rect width="300" height="419" fill="url(#'+uid+'-tile)"/>'
      +'<circle cx="150" cy="209" r="58" fill="#f3eee2" stroke="#c89b3c" stroke-width="2"/>'
      +'<circle cx="150" cy="209" r="52" fill="none" stroke="#c89b3c" stroke-width=".8"/>'
      +'<use href="#'+ns+'" x="110" y="169" width="80" height="80"/>'
      +'</svg>';
  }

  /* ---- カード（表・裏） ---- */
  /* つながり先の id。表記揺れは aliases.json で引く。未収録の語は null */
  var ALIASES={};
  function resolve(name){ return BYID[name] ? name : (BYID[ALIASES[name]] ? ALIASES[name] : null); }
  function ownsLink(name){ var id=resolve(name); return !!(id && S.owned[id]); }

  /* id の繋がり先（自分の links と、自分を links に持つカード。向きは問わない）。起動時に作る */
  var NEIGHBORS={};
  function buildNeighbors(){
    CARDS.forEach(function(c){ NEIGHBORS[c.id]=NEIGHBORS[c.id]||{}; });
    CARDS.forEach(function(c){
      (c.links||[]).forEach(function(l){
        var id=resolve(l);
        if(!id || id===c.id) return;
        NEIGHBORS[c.id][id]=1; NEIGHBORS[id][c.id]=1;
      });
    });
  }
  /* いま所持している繋がり先の数 */
  function ownedNeighbors(id){
    return Object.keys(NEIGHBORS[id]||{}).filter(function(n){ return S.owned[n]; }).length;
  }

  /* 用語の幅（全角=1、半角の大文字=0.72、そのほかの半角=0.6） */
  function termWidth(t){ var w=0; for(var ch of t) w+=/[A-Z]/.test(ch) ? .72 : /[\x20-\x7e]/.test(ch) ? .6 : 1; return w; }
  /* 用語の折り方。区切りのいい位置（・と の に る の後、（「 の前、カタカナと漢字・英数字の境目）で
     釣り合う所があれば2行。なければ、12字までは1行のまま縮める。それより長ければ区切りか真ん中で折る
     （ー や小さいかなを行頭に置かない） */
  var KATA=/[ァ-ヺー]/, NOHEAD=/[ーァィゥェォャュョッヮ）」、。]/;
  function termHTML(t){
    var w=termWidth(t), one='<h2 class="term" style="--w:'+w.toFixed(2)+'">'+esc(t)+'</h2>';
    if(w<=8) return one;
    var chars=Array.from(t), best=-1, bestW=Infinity, mid=-1, midW=Infinity;
    for(var i=1;i<chars.length;i++){
      var x=termWidth(chars.slice(0,i).join('')), longer=Math.max(x, w-x), p=chars[i-1], n=chars[i];
      if(!NOHEAD.test(n) && longer<midW){ midW=longer; mid=i; }
      var ok=/[・とのにる]/.test(p) || /[（「]/.test(n) || (KATA.test(p) !== KATA.test(n) && !/[・（）「」]/.test(p+n) && !/[ぁ-ん]/.test(p+n));
      if(ok && !NOHEAD.test(n) && longer<bestW){ bestW=longer; best=i; }
    }
    if(!(best>0 && bestW<=w*.76)){
      if(w<=12) return one;
      if(best<0){ best=mid; bestW=midW; }
    }
    return '<h2 class="term two" style="--w:'+bestW.toFixed(2)+'">'+esc(chars.slice(0,best).join(''))+'<br>'+esc(chars.slice(best).join(''))+'</h2>';
  }
  /* 出題年度バッジ：既出は年度を金色で、周辺語は灰色で */
  function badge(ex){
    return ex.kind==='既出'
      ? '<span class="badge k">'+ex.years.join('・')+'</span>'
      : '<span class="badge s">周辺語</span>';
  }

  /* ---- カード（表・裏） ---- */
  var seq=0;
  function cardHTML(c, kira){
    var uid='c'+(++seq);
    var pills=(c.links||[]).slice(0,3).map(function(l){
      return '<span class="'+(ownsLink(l) ? 'on' : 'off')+'">'+esc(l)+'</span>';
    }).join('');
    return ''
      +'<div class="card'+(kira ? ' kira' : '')+'" role="button" tabindex="0" aria-label="'+esc(c.term)+' のカード。タップで裏返す、長押しで説明">'
      +  '<div class="face front'+(c.figure && c.figure.status==='approved' ? ' hasfig' : '')+'">'
      +    '<div class="meta">'+badge(c.exam)+(c.exam.note ? '<small>'+esc(c.exam.note)+'</small>' : '')+'</div>'
      +    '<div class="main">'+termHTML(c.term)
      +    '<p class="usage">'+esc(c.usage)+'</p></div>'
      +    (c.figure && c.figure.status==='approved' && window.Figure ? '<div class="cfig">'+Figure.svg(c.figure)+'</div>' : '')
      +    '<div class="links"><span>つながり</span><div class="pills">'+pills+'</div></div>'
      +    '<div class="foot"><span>文化資源学　'+esc(c.exam.kind)+'</span><i>'+(kira ? '◆◆◆' : '◇◇◇')+'</i></div>'
      +    (kira ? '<div class="holo"></div>' : '')
      +    '<div class="sheen"></div>'
      +  '</div>'
      +  '<div class="face back" aria-hidden="true">'+back(uid)+'</div>'
      +  '<div class="sparks"></div>'
      +'</div>';
  }

  /* 写真1枚とキャプション・クレジット。クレジットは出典（Commons のファイルページ）へのリンク */
  function photoHTML(ph){
    if(!ph || !ph.file) return '';
    return '<figure class="ph"><img src="'+esc(encodeURI(ph.file))+'" alt="'+esc(ph.caption||'')+'" decoding="async" onerror="this.parentNode.classList.add(\'fail\')">'
      +'<figcaption>'+esc(ph.caption||'')
      +'<a href="'+esc(ph.source)+'" target="_blank" rel="noopener">'+esc(ph.credit)+'</a></figcaption></figure>';
  }

  /* ---- 説明全文の面（英単語版の語源面と同じ作り） ---- */
  function etymHTML(c){
    return ''
      +'<h1'+(termWidth(c.term)>9 ? ' class="l"' : '')+'>'+esc(c.term)+'</h1>'
      +photoHTML(c.photo)
      +'<p>'+esc(c.body)+'</p>'
      +chatBoxHTML()
      +'<div class="src"><button type="button" class="close">カードに戻る</button></div>';
  }

  var etym=document.getElementById('etym'), flash=document.getElementById('flash');
  var etymCard=null, etymDone=null;

  function showEtym(c, card, x, y, onClosed){
    etym.innerHTML=etymHTML(c);
    var closeBtn=etym.querySelector('.close');
    closeBtn.addEventListener('click', closeEtym);
    bindChat(etym.querySelector('.chat'), c);
    renderNet();
    etymCard=card; etymDone=onClosed;
    etym.style.setProperty('--cx', x+'px'); etym.style.setProperty('--cy', y+'px');
    setTimeout(function(){
      card.classList.add('burst');
      etym.classList.remove('hide'); etym.classList.add('show'); etym.setAttribute('aria-hidden','false');
      closeBtn.focus({preventScroll:true});
    },120);
  }
  function closeEtym(){
    if(!etymCard) return;
    var card=etymCard, done=etymDone; etymCard=null;
    etym.classList.remove('show'); etym.classList.add('hide'); etym.setAttribute('aria-hidden','true');
    card.classList.remove('burst');
    setTimeout(function(){ etym.classList.remove('hide'); if(done) done(); },520);
  }
  etym.addEventListener('keydown', function(e){ if(e.key==='Escape' && !e.target.closest('.chat')) closeEtym(); });

  /* =====================================================
     Claude を直接呼ぶ（B-live）。鍵はこの端末の localStorage にだけ置く
     ===================================================== */
  var APIKEY='bunka:apikey', MODEL='claude-sonnet-5-5';
  function apiKey(){ try{ return localStorage.getItem(APIKEY)||''; }catch(e){ return ''; } }

  /* 鍵の入力。保存できたら true で resolve */
  function askKey(){
    var dlg=$('keyDlg'), input=$('keyInput');
    input.value='';
    return new Promise(function(resolve){
      function done(ok){
        dlg.removeEventListener('close', onClose);
        resolve(ok);
      }
      function onClose(){
        var k=dlg.returnValue==='save' ? input.value.trim() : '';
        input.value='';
        if(k){ try{ localStorage.setItem(APIKEY, k); }catch(e){} }
        done(!!(k && apiKey()));
      }
      dlg.returnValue='';
      dlg.addEventListener('close', onClose);
      dlg.showModal();
      input.focus();
    });
  }
  $('keySave').addEventListener('click', function(e){ e.preventDefault(); $('keyDlg').close('save'); });
  $('keyCancel').addEventListener('click', function(){ $('keyDlg').close(''); });

  /* 圏外のときは B 機能のボタンを灰色にして「圏外」と出す。カード・開封・小テストは影響なし */
  function online(){ return navigator.onLine !== false; }
  function renderNet(){
    var off=!online(), eb=$('essayBtn');
    eb.disabled=off; eb.textContent=off ? '記述　圏外' : '記述';
    eb.classList.toggle('nokey', off || !apiKey());
    document.querySelectorAll('.chat').forEach(function(box){
      var b=box.querySelector('form button');
      b.disabled=off || !!box.dataset.busy; b.textContent=off ? '圏外' : '送信';
      box.classList.toggle('nokey', off || !apiKey());
    });
    if($('esSend')) countEssay();
  }
  window.addEventListener('online', renderNet);
  window.addEventListener('offline', renderNet);

  /* 承認済みデータをそのまま渡す（説明文は要約しない） */
  function cardContext(c){
    return '用語：'+c.term+'\n'
      +'出題：'+(c.exam.kind==='既出' ? c.exam.years.join('・')+'年度・既出' : '周辺語')+(c.exam.note ? '／'+c.exam.note : '')+'\n'
      +'説明文：'+c.body+'\n'
      +'使いどころ：'+c.usage+'\n'
      +'つながり：'+(c.links||[]).join('、');
  }

  /* user は1つの文字列か、{role, content} の配列（会話） */
  function callClaude(system, user){
    return fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'x-api-key':apiKey(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
        'content-type':'application/json'
      },
      /* Sonnet 5.5 は指定しないと思考してから答え、その分も max_tokens に数えられて本文が途中で切れる。
         ツールを使わないので between_tools で思考を止め、800 を本文に回す */
      body:JSON.stringify({ model:MODEL, max_tokens:800, thinking:{ type:'between_tools' }, system:system, messages:Array.isArray(user) ? user : [{ role:'user', content:user }] })
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        if(!r.ok){
          var err=new Error((d.error && d.error.message) || ('HTTP '+r.status)); err.status=r.status; throw err;
        }
        if(d.stop_reason==='refusal'){ var rf=new Error('この質問には答えられませんでした'); rf.status='refusal'; throw rf; }
        var text=(d.content||[]).filter(function(b){ return b.type==='text'; }).map(function(b){ return b.text; }).join('').trim();
        if(d.stop_reason==='max_tokens') text+=' …（長さの上限で途中で切れました）';
        return text;
      });
    });
  }

  /* =====================================================
     Claude先生に聞く（LINE 風）。右があなた＝KANTAくん、左が Claude先生。
     掛け合いのある語（dialogues.json、原文のまま）はそれを最初の会話として出し、続けて聞ける。
     先生は会話の流れを踏まえて答える。会話は残さない（長押し面を閉じたら消える）
     ===================================================== */
  var DIALOGS={};
  /* 浜通りの知識（学習者が端末で読み込んだテキスト）。個人情報を含むので、アプリのファイルにも書き出しにも入れず、
     この端末の localStorage にだけ置く。先生への質問のときだけ API に送る */
  var KNOW='bunka:knowledge';
  function knowledge(){ try{ return localStorage.getItem(KNOW)||''; }catch(e){ return ''; } }
  var HAMADORI='\n【浜通りとの結びつけ方】\n'
    +'下の「浜通りの知識」は、学習者（KANTAくん）の研究対象である福島県浜通り地域の背景知識。次の場合分けで使う。\n'
    +'1. KANTAくんが浜通りとの関係を明示的に聞いたとき（「浜通りと繋げると？」「浜通りでいうと？」など）：必ず浜通りに結びつけて答える。'
    +'知識の第0節「どう答えるか」に従い、場面→定義→浜通りでの現れ方→立つ問いの順で、町名で具体的に書く。この場合だけ300字以内でよい。'
    +'ただし第0節の9の「末尾に掛け合いを一往復足す」はしない（チャット自体が掛け合いなので）。\n'
    +'2. 聞かれていないが、その用語が文脈上無理なく浜通りに結びつくとき：ふつうに答えたあと、最後に「浜通りでいうと〜」を一文だけ添えてよい。毎回は添えない。'
    +'結びつきが弱いときや、会話の流れが別の話題のときは添えない。\n'
    +'3. 浜通りとの結びつきを聞かれたが、その用語が浜通りとほとんど関係しないとき：無理に結びつけず、「うーん、これは浜通りとは関係なく覚えてね」と言ってから、ふつうに答える。\n'
    +'どの場合も、知識にない浜通りの事実は作らない。【要確認】の事項は確かでないと断る。数値には時点を付ける。「風評」「払拭」の語で浜通りを語らない。\n';
  var SENSEI='あなたは「Claude先生」。東京大学大学院（文化資源学）の入試に向けて学ぶ「KANTAくん」の質問に、LINE のチャットで答える。\n'
    +'KANTAくんは用語を字面で誤解したり、身近な例に引き寄せたり、ちょっとボケたりする。\n'
    +'答え方：\n'
    +'・まず誤解があれば、やさしく正す（「〜ではありません」「逆です」）。\n'
    +'・すぐ核心を短く言う。2〜3文、全体で150字以内（浜通りに結びつけて答えるときは下の決まりに従う）。です・ます調。前置きや見出し、箇条書き、記号での強調は使わない。\n'
    +'・年号や仕組み、具体例を一つ添えると覚えやすい。ボケには軽く乗ってから論点に戻す。\n'
    +'・下の用語カード（承認済み）の内容を前提にする。カードにない事実は確かなものだけを述べ、不確かなときはそう言う。\n'
    +'・入試の論述で使える観点（論点・使いどころ）につなげられるときはつなげる。\n';
  function sampleDialogs(skip){
    var ids=Object.keys(DIALOGS).filter(function(id){ return id!==skip; }).slice(0, 2);
    return ids.map(function(id){
      return '（'+id+'）\n'+DIALOGS[id].map(function(m){ return (m.who==='k' ? 'KANTAくん：' : 'Claude先生：')+m.text; }).join('\n');
    }).join('\n\n');
  }
  function bubble(who, text, extra){
    return '<div class="msg '+who+(extra ? ' '+extra : '')+'"><span class="av" aria-hidden="true">'+(who==='k' ? 'K' : '先')+'</span>'
      +'<div class="bub"><span class="who">'+(who==='k' ? 'KANTAくん' : 'Claude先生')+'</span><p>'+esc(text)+'</p></div></div>';
  }
  /* 会話はカードごとに残す（bunka:chats）。文書の掛け合いは dialogues.json にあるので、残すのは自分で聞いた分だけ。
     書き出しに含め、読み込みで戻す。アプリの版を上げても消えない */
  var CHATS='bunka:chats', CHAT_KEEP=200, CHAT_SEND=16;
  function loadChats(){ try{ var o=JSON.parse(localStorage.getItem(CHATS)); return o && typeof o==='object' && !Array.isArray(o) ? o : {}; }catch(e){ return {}; } }
  function saveChats(o){ try{ localStorage.setItem(CHATS, JSON.stringify(o)); }catch(e){} }
  /* 直近 CHAT_SEND 件を送る。会話は必ず KANTAくん（user）から始まる決まりなので、先頭が先生なら1件落とす。
     送り直すたびに同じになる部分（新しい質問の1つ前まで）にキャッシュの印を付ける */
  function chatPayload(msgs){
    var m=msgs.slice(-CHAT_SEND);
    if(m.length && m[0].role!=='user') m=m.slice(1);
    return m.map(function(x, i){
      return i===m.length-2 ? { role:x.role, content:[{ type:'text', text:x.content, cache_control:{ type:'ephemeral' } }] } : { role:x.role, content:x.content };
    });
  }
  function chatBoxHTML(){
    return '<div class="chat'+(apiKey() ? '' : ' nokey')+'"><div class="chat-log" aria-live="polite"></div>'
      +'<div class="chat-tools" hidden><button type="button" class="chat-clear">この会話を消す</button></div>'
      +'<form><input type="text" maxlength="200" enterkeyhint="send" placeholder="KANTAくんとして先生に聞く" aria-label="Claude先生に聞く"><button type="submit">送信</button></form></div>';
  }
  /* o（省略可）：seed 最初に出す会話（既定は文書の掛け合い）／save 会話を残すか（既定は残す）／
     extra 先生に添える前提（語のカードのあとに置く）／draft 入力欄に入れておく下書き */
  function bindChat(box, c, o){
    o=o||{};
    var keep=o.save!==false;
    var form=box.querySelector('form'), input=box.querySelector('input'), btn=form.querySelector('button'), log=box.querySelector('.chat-log');
    var tools=box.querySelector('.chat-tools'), seed=o.seed || DIALOGS[c.id] || [], saved=keep ? (loadChats()[c.id]||[]) : [], msgs;
    if(o.draft) input.value=o.draft;
    function render(){
      /* 定型の掛け合い（覚えた気がする）は表示だけ。先生が言っていないセリフなので API には送らない */
      msgs=seed.map(function(m){ return { role:m.who==='k' ? 'user' : 'assistant', content:m.text }; })
        .concat(saved.filter(function(m){ return !m.canned; }).map(function(m){ return { role:m.role, content:m.content }; }));
      log.innerHTML=seed.map(function(m){ return bubble(m.who, m.text); }).join('')
        +saved.map(function(m){ return bubble(m.role==='user' ? 'k' : 't', m.content); }).join('');
      tools.hidden=!keep || !saved.length;
    }
    render();
    box.querySelector('.chat-clear').addEventListener('click', function(){
      if(busy || !confirm('《'+c.term+'》の会話を消します（文書の掛け合いは残ります）')) return;
      var all=loadChats(); delete all[c.id]; saveChats(all);
      saved=[]; render();
    });
    var busy=false;
    function add(html){
      log.insertAdjacentHTML('beforeend', html);
      var last=log.lastElementChild; if(last && last.scrollIntoView) last.scrollIntoView({ block:'nearest', behavior:'smooth' });
      return last;
    }
    form.addEventListener('submit', function(e){
      e.preventDefault();
      if(busy || !online()) return;
      var q=input.value.trim();
      (apiKey() ? Promise.resolve(true) : askKey()).then(function(ok){
        box.classList.toggle('nokey', !apiKey());
        if(!ok || !q){ if(ok) input.focus(); return; }
        input.value='';
        add(bubble('k', q, 'new'));
        msgs.push({ role:'user', content:q });
        busy=true; box.dataset.busy='1'; btn.disabled=true;
        var typing=add(bubble('t', '…', 'typing'));
        /* 変わらない部分（先生の決まり＋浜通りの知識）を先に置き、キャッシュの印を付ける。
           語ごとに変わる部分（手本・用語カード）はその後ろ。知識が長いので、続けて聞くときの料金を抑えるため */
        var know=knowledge(), tail='\n【話し方の手本（別の語の掛け合い）】\n'+sampleDialogs(c.id)+'\n\n【用語カード】\n'+cardContext(c)+(o.extra||'');
        var system=know
          ? [{ type:'text', text:SENSEI+HAMADORI+'\n【浜通りの知識】\n'+know, cache_control:{ type:'ephemeral' } }, { type:'text', text:tail }]
          : SENSEI+tail;
        callClaude(system, chatPayload(msgs)).then(function(text){
          typing.remove();
          text=text || '（答えが空でした）';
          msgs.push({ role:'assistant', content:text });
          add(bubble('t', text, 'new'));
          /* 答えが返った問いと答えの組だけ残す（残さない会話ではここで終わり） */
          if(!keep) return;
          var now=Date.now(), all=loadChats();
          saved=saved.concat([{ role:'user', content:q, at:now }, { role:'assistant', content:text, at:now }]).slice(-CHAT_KEEP);
          all[c.id]=saved; saveChats(all);
          tools.hidden=false;
        }, function(err){
          typing.remove();
          msgs.pop();   /* 答えられなかった質問は会話に残さない（次に送るときの順番が崩れないように） */
          add(bubble('t', err.status==='refusal' ? err.message : err.status===401 ? '鍵が正しくないようです。コレクション画面の「鍵を消す」から入れ直してください。'
            : err.status ? 'うまく答えられませんでした（'+err.status+'：'+err.message+'）' : '通信できませんでした。もう一度送ってください', 'err'));
        }).then(function(){ busy=false; delete box.dataset.busy; renderNet(); input.focus({ preventScroll:true }); });
      });
    });
  }

  /* 火花1つ。黄と紫を半々 */
  function spawnSpark(sparks, p){
    var s=document.createElement('span'); s.className='spark';
    s.style.left=(5+Math.random()*90)+'%';
    s.style.setProperty('--dx', ((Math.random()-.5)*60)+'px');
    s.style.setProperty('--dy', (60+Math.random()*180*(0.4+p))+'px');
    s.style.setProperty('--d', (0.7+Math.random()*0.6)+'s');
    s.style.width=s.style.height=(3+Math.random()*5)+'px';
    if(Math.random()<.5){ s.style.background='#c89b3c'; s.style.boxShadow='0 0 8px 2px rgba(200,155,60,.7)'; }
    sparks.appendChild(s);
    s.addEventListener('animationend', function(){ s.remove(); });
  }

  /* ---- 操作（見本と同じ）。card.dataset.locked の間は反応しない ---- */
  function bindCard(card, c){
    var sparks=card.querySelector('.sparks');
    var HOLD=1100, TAP=300;
    var pressing=false, start=0, raf=0, sx=0, sy=0, moved=false, lastSpark=0, done=false, pid=null;

    function setP(p){ card.style.setProperty('--p', p.toFixed(3)); }

    function spawn(p){ spawnSpark(sparks, p); }

    function loop(now){
      if(!pressing) return;
      var p=Math.min(1,(now-start)/HOLD);
      setP(p);
      var gap=140-120*p;
      if(now-lastSpark>gap){ spawn(p); lastSpark=now; if(p>.6) spawn(p); }
      if(p>=1){ complete(); return; }
      raf=requestAnimationFrame(loop);
    }

    function release(){
      pressing=false; cancelAnimationFrame(raf);
      card.classList.remove('press');
      try{ if(pid!==null) card.releasePointerCapture(pid); }catch(e){}
      pid=null;
      setP(0);
    }

    function complete(){
      if(done) return; done=true;
      pressing=false; cancelAnimationFrame(raf);
      card.classList.remove('press');
      try{ if(pid!==null) card.releasePointerCapture(pid); }catch(e){}
      for(var i=0;i<28;i++) spawn(1);
      flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
      showEtym(c, card, sx, sy, function(){ done=false; });
      setTimeout(function(){ setP(0); },400);
    }

    card.addEventListener('pointerdown', function(e){
      if(done || card.dataset.locked) return;
      if(card.classList.contains('flipped')){ pressing=false; start=performance.now(); moved=false; return; }
      pressing=true; moved=false; start=performance.now(); lastSpark=start; sx=e.clientX; sy=e.clientY; pid=e.pointerId;
      try{ card.setPointerCapture(pid); }catch(err){}
      card.classList.add('press');
      raf=requestAnimationFrame(loop);
      e.preventDefault();
    });
    card.addEventListener('pointermove', function(e){
      if(Math.abs(e.clientX-sx)>12||Math.abs(e.clientY-sy)>12) moved=true;
      /* めくれる画面では、横に14px以上動かしたら長押しをやめる（スワイプと取り違えない） */
      if(pressing && card.dataset.swipe && Math.abs(e.clientX-sx)>14) release();
    });
    function up(e){
      if(done || card.dataset.locked) return;
      var dt=performance.now()-start;
      var wasPressing=pressing;
      if(wasPressing) release();
      if(dt<TAP && !moved) card.classList.toggle('flipped');
    }
    card.addEventListener('pointerup', up);
    card.addEventListener('pointercancel', function(){ if(pressing) release(); });
    card.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    card.addEventListener('keydown', function(e){
      if(card.dataset.locked) return;
      if(e.key===' '||e.key==='Enter'){ e.preventDefault(); card.classList.toggle('flipped'); }
      if(e.key==='e'||e.key==='E'){ sx=innerWidth/2; sy=innerHeight/2; complete(); }
    });
  }

  function mountCard(host, c, o){
    o=o||{};
    host.innerHTML=cardHTML(c, o.kira);
    var el=host.querySelector('.card');
    if(o.flipped) el.classList.add('flipped');
    if(o.locked) el.dataset.locked='1';
    if(o.swipe) el.dataset.swipe='1';
    if(!o.inert) bindCard(el, c);
    return el;
  }

  /* =====================================================
     状態（localStorage）
     ===================================================== */
  var HOUR=3600e3, FULL=6*HOUR, PACK=5, PACK_NEW=2, RECALL=3000, SHOW_ANSWER=3000;
  var KEY='bunka:state.v1';   /* 同じ github.io 配下の英単語版と保存領域を分ける */

  function fresh(){
    return {
      v:1,
      owned:{},          /* id → { order, first, met, kira } */
      nextOrder:1,
      charge:2*FULL,     /* ゲージ（ms）。初期は2パック分 */
      chargeAt:Date.now(),
      points:0,
      lastOpen:null,
      quizLog:{},        /* id → 出題日 'YYYY-MM-DD'（当日分だけ残す） */
      pending:null       /* 開封途中のパック */
    };
  }
  function valid(s){ return s && s.v===1 && typeof s.owned==='object' && typeof s.charge==='number'; }
  function load(){
    try{ var s=JSON.parse(localStorage.getItem(KEY)); if(valid(s)) return s; }catch(e){}
    return fresh();
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  /* ゲージは満タン未満のときだけ時間で溜まる。満タン以上（初期の2パック分など）はそのまま */
  function charge(){
    var c=S.charge;
    if(c<FULL) c=Math.min(FULL, c+Math.max(0, Date.now()-S.chargeAt));
    return c;
  }
  function settle(){ S.charge=charge(); S.chargeAt=Date.now(); }
  function pointsNeeded(){ var c=charge(); return c>=FULL ? 0 : Math.ceil((FULL-c)/HOUR); }

  function dayKey(t){
    var d=t ? new Date(t) : new Date();
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
  }
  function shuffle(a){
    a=a.slice();
    for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmt(ms){
    var m=Math.ceil(ms/60000), h=Math.floor(m/60); m=m%60;
    return h ? h+'時間'+(m ? m+'分' : '') : m+'分';
  }

  var S, CARDS=[], BYID={}, APPROVED=[];

  /* =====================================================
     画面切り替え
     ===================================================== */
  var screens=['home','open','result','viewer','collection','quiz','quizEnd','essay','cloze','ctest'];
  var current=null, homeTimer=0;
  function show(name){
    screens.forEach(function(s){ document.getElementById(s).classList.toggle('on', s===name); });
    current=name;
    clearInterval(homeTimer);
    if(name==='home'){ renderHome(); homeTimer=setInterval(renderHome, 20000); }
  }
  function $(id){ return document.getElementById(id); }

  /* =====================================================
     1. ホーム
     ===================================================== */
  var pack=$('pack');
  function renderHome(){
    var c=charge(), n=Math.floor(c/FULL), need=pointsNeeded();
    pack.style.setProperty('--g', Math.min(1, c/FULL).toFixed(3));
    var st='', can=false;
    if(S.pending){
      st='開封の続き'; can=true;
    }else if(!APPROVED.length){
      st='承認済みのカードがまだありません';
    }else if(n>=1){
      st=n>=2 ? '開けられます　×'+n : '開けられます'; can=true;
    }else{
      st='あと '+fmt(FULL-c);
      if(S.points>=need){ st+='<small>'+need+'ポイントを使えば今すぐ開けられます</small>'; can=true; }
    }
    $('homeStatus').innerHTML=st+'<small>ポイント '+S.points+'</small>';
    pack.classList.toggle('ready', can);
    renderNet();
    pack.classList.toggle('locked', !can);
    pack.setAttribute('aria-label', 'パック。'+$('homeStatus').textContent);
    var owned=Object.keys(S.owned).length;
    $('collBtn').textContent='コレクション　'+owned+'枚';
  }
  function tapPack(){
    if(!pack.classList.contains('ready')) return;
    if(!S.pending){
      settle();
      if(S.charge<FULL){
        var need=pointsNeeded();
        if(S.points<need) return;
        S.points-=need; S.charge+=need*HOUR;
      }
      S.charge-=FULL; S.chargeAt=Date.now(); S.lastOpen=Date.now();
      S.pending={ cards:composePack(), idx:0, torn:false };
      save();
    }
    startOpen();
  }
  pack.addEventListener('click', tapPack);
  pack.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tapPack(); } });

  /* 手持ち3枚（復習）＋未所持2枚（発見）。未所持が足りなければ手持ちで、手持ちが足りなければ未所持で埋める。
     発見を最後に置く */
  function composePack(){
    var ids=APPROVED.map(function(c){ return c.id; });
    var have=shuffle(ids.filter(function(id){ return S.owned[id]; }));
    var fresh_=shuffle(ids.filter(function(id){ return !S.owned[id]; }));
    var n=Math.min(PACK, ids.length);
    var nNew=Math.min(PACK_NEW, fresh_.length);
    var nOld=Math.min(n-nNew, have.length);
    nNew=Math.min(n-nOld, fresh_.length);
    return have.slice(0,nOld).map(function(id){ return { id:id, isNew:false, done:false }; })
      .concat(fresh_.slice(0,nNew).map(function(id){ return { id:id, isNew:true, done:false }; }));
  }

  /* =====================================================
     2. 開封：破く → 1枚ずつ反転 → 結果一覧
     ===================================================== */
  function startOpen(){
    var P=S.pending;
    show('open');
    if(!P.torn) renderTear(); else renderOpenCard();
  }

  function renderTear(){
    $('openCount').textContent='';
    $('openWord').textContent=''; $('openWord').classList.add('off');
    $('openStage').innerHTML='<div class="tear-wrap"><div class="pack ready" id="tearPack" tabindex="0" role="button" aria-label="パックを破く">'
      +pack.innerHTML+'<div class="pk-top"><div class="pk-cut"></div></div></div></div>';
    $('openCtl').textContent='上の端を横になぞって破く';
    var tp=$('tearPack'), top=tp.querySelector('.pk-top'), sx=0, on=false, torn=false;
    tp.style.setProperty('--g','1');
    function setT(t){ top.style.setProperty('--t', t.toFixed(3)); }
    tp.addEventListener('pointerdown', function(e){
      if(torn) return; on=true; sx=e.clientX;
      try{ tp.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
    });
    tp.addEventListener('pointermove', function(e){
      if(!on||torn) return;
      var t=Math.min(1, Math.abs(e.clientX-sx)/(tp.offsetWidth*.7));
      setT(t);
      if(t>=1) tear();
    });
    function end(){ if(!torn){ on=false; setT(0); } }
    tp.addEventListener('pointerup', end);
    tp.addEventListener('pointercancel', end);
    tp.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); setT(1); tear(); } });
    function tear(){
      if(torn) return; torn=true; on=false;
      tp.classList.add('torn');
      $('openCtl').textContent='';
      setTimeout(function(){ tp.classList.add('gone'); }, 380);
      setTimeout(function(){ S.pending.torn=true; save(); renderOpenCard(); }, 900);
    }
    tp.focus({preventScroll:true});
  }

  function renderOpenCard(){
    var P=S.pending, e=P.cards[P.idx], c=BYID[e.id];
    $('openCount').textContent=(P.idx+1)+' / '+P.cards.length;
    var w=$('openWord'); w.textContent=c.term; w.classList.remove('off');
    var o=S.owned[e.id];
    var card=mountCard($('openStage'), c, { kira:o&&o.kira, flipped:!e.done, locked:!e.done });
    var ctl=$('openCtl');
    if(e.done){ nextButton(); w.classList.add('off'); return; }

    if(e.isNew){
      ctl.innerHTML='<button type="button" class="btn" data-k="0">知ってる</button><button type="button" class="btn" data-k="1">知らない</button>';
      ctl.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){
          var unknown=b.dataset.k==='1';
          S.owned[e.id]={ order:S.nextOrder++, first:Date.now(), met:1, kira:unknown };
          e.done=true; save();
          if(unknown){ mountCard($('openStage'), c, { kira:true, flipped:true, locked:true }); card=$('openStage').querySelector('.card'); void card.offsetWidth; }
          reveal(card);
        });
      });
    }else{
      /* ダブり：反転前に意味を思い出す時間 */
      ctl.innerHTML='<span class="recall">意味を思い出す</span>';
      setTimeout(function(){
        if(current!=='open' || S.pending!==P || P.idx!==P.cards.indexOf(e)) return;
        S.owned[e.id].met++;
        e.done=true; save();
        reveal(card);
      }, RECALL);
    }
  }

  function reveal(card){
    var P=S.pending, id=P.cards[P.idx].id, n=ownedNeighbors(id);
    $('openCtl').innerHTML='';
    $('openWord').classList.add('off');
    card.classList.remove('flipped');
    /* 表が見えはじめる頃に、繋がり1本につき火花ひと群れ */
    var sparks=card.querySelector('.sparks');
    for(var k=0;k<n;k++) setTimeout(function(){ for(var i=0;i<10;i++) spawnSpark(sparks, 1); }, 300+k*180);
    if(n) setTimeout(function(){ card.querySelectorAll('.pills span.on').forEach(function(s){ s.classList.add('glow'); }); }, 350);
    setTimeout(function(){ delete card.dataset.locked; nextButton(); }, 700);
  }

  function nextButton(){
    var P=S.pending, last=P.idx>=P.cards.length-1;
    $('openCtl').innerHTML='<button type="button" class="btn primary">'+(last ? '結果を見る' : '次へ')+'</button>';
    $('openCtl').querySelector('button').addEventListener('click', function(){
      if(last){ finishOpen(); return; }
      P.idx++; save(); renderOpenCard();
    });
  }

  /* このパックで新しく出会ったカードと、所持カードとの間にできた繋がりの本数（同じ2枚は1本） */
  function newLinks(P){
    var fresh_={}, seen={}, n=0;
    P.cards.forEach(function(e){ if(e.isNew) fresh_[e.id]=1; });
    Object.keys(fresh_).forEach(function(a){
      Object.keys(NEIGHBORS[a]||{}).forEach(function(b){
        if(!S.owned[b]) return;
        var key=a<b ? a+'|'+b : b+'|'+a;
        if(!seen[key]){ seen[key]=1; n++; }
      });
    });
    return n;
  }

  function finishOpen(){
    var P=S.pending; S.pending=null; save();
    var list=$('resultList');
    list.innerHTML=P.cards.map(function(e){
      var c=BYID[e.id], o=S.owned[e.id];
      return '<div class="row"><b>'+esc(c.term)+'</b><span>'+esc(c.usage)+'</span>'
        +(e.isNew ? '<i class="tag">新しく出会った</i>' : '')
        +(o.kira ? '<i class="tag k">キラ</i>' : '')
        +'<em>会った '+o.met+'回</em></div>';
    }).join('');
    document.querySelector('#result .h2').textContent='今回の'+P.cards.length+'枚';
    $('resultLinks').innerHTML='新しく繋がった本数　<b>'+newLinks(P)+'</b>本';
    show('result');
  }
  $('resultHome').addEventListener('click', function(){ show('home'); });

  /* =====================================================
     3. カード／4. コレクション
     ===================================================== */
  function renderCollection(){
    var ids=Object.keys(S.owned).filter(function(id){ return BYID[id]; })
      .sort(function(a,b){ return S.owned[a].order-S.owned[b].order; });
    var g=$('grid');
    $('ctBtn').disabled=!ids.length;
    if(!ids.length){ g.innerHTML='<div class="empty" style="grid-column:1/-1">まだカードがありません</div>'; return; }
    g.innerHTML=ids.map(function(id){
      var c=BYID[id], o=S.owned[id];
      return '<button type="button" class="tile'+(o.kira ? ' kira' : '')+'" data-id="'+esc(id)+'">'
        +(o.kira ? '<div class="holo"></div>' : '')
        +'<b>'+esc(c.term)+'</b>'
        +'<span class="tf">'+(!o.kira && o.learned ? '<em class="lrn">知らなかった→覚えた</em>' : '')+'<em>会った '+o.met+'回</em><i>'+(o.kira ? '◆◆◆' : '◇◇◇')+'</i></span></button>';
    }).join('');
  }
  $('grid').addEventListener('click', function(e){
    var t=e.target.closest('.tile'); if(!t) return;
    openViewer(t.dataset.id);
  });
  /* カードの下に、つながり先（自分の links。表記揺れは解決して表示は原文のまま）を所持／未所持で並べる。
     所持はタップでそのカードへ。未所持は何も起きない */
  /* カードを開いた画面：並びはコレクションと同じ（出会った順）。端まで行ったら一周 */
  function ownedIds(){
    return Object.keys(S.owned).filter(function(id){ return BYID[id]; })
      .sort(function(a,b){ return S.owned[a].order-S.owned[b].order; });
  }
  var view={ ids:[], i:0 }, claimTimers=[];
  function stopClaim(){ claimTimers.forEach(clearTimeout); claimTimers=[]; }
  function openViewer(id){
    view.ids=ownedIds(); view.i=Math.max(0, view.ids.indexOf(id));
    show('viewer'); $('viewer').scrollTop=0;
    openView(0);
  }
  function openView(d){
    stopClaim();
    var id=view.ids[view.i], c=BYID[id], st=$('viewerStage');
    var card=mountCard(st, c, { kira:S.owned[id].kira, swipe:true });
    st.classList.remove('in-l','in-r');
    if(d){ void st.offsetWidth; st.classList.add(d>0 ? 'in-l' : 'in-r'); }
    $('viewerN').textContent=view.ids.length>1 ? (view.i+1)+' / '+view.ids.length : '';
    $('viewerPrev').hidden=$('viewerNext').hidden=view.ids.length<2;
    $('viewerChat').innerHTML='';
    $('viewerLinks').innerHTML=(c.links||[]).map(function(l){
      var to=resolve(l), on=!!(to && S.owned[to]);
      return '<button type="button" class="'+(on ? 'on' : 'off')+'"'+(on ? ' data-id="'+esc(to)+'"' : ' tabindex="-1" aria-disabled="true"')+'>'+esc(l)+'</button>';
    }).join('');
    renderClaim();
    /* 「覚えた気がする」は表を見ているときだけ */
    new MutationObserver(renderClaim).observe(card, { attributes:true, attributeFilter:['class'] });
  }
  function renderClaim(){

  var CLAIM_T=['ほんとですかね。まあ、信じましょう。',

  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  function bubbleHTML(who, html, extra){
    return '<div class="msg '+who+(extra ? ' '+extra : '')+'"><span class="av" aria-hidden="true">'+(who==='k' ? 'K' : '先')+'</span>'

  function scrollEnd(el){ if(el && el.scrollIntoView) el.scrollIntoView({ block:'nearest', behavior:'smooth' }); }
  /* 吹き出しを「…」のあとに出す。lead は「…」を出しておく時間 */
  function talk(log, who, html, lead, timers){

        if(lead){ log.insertAdjacentHTML('beforeend', bubbleHTML(who, '…', 'typing')); t=log.lastElementChild; scrollEnd(t); }

  $('claimBtn').addEventListener('click', function(){

  /* =====================================================
     5. 小テスト：124語からランダム5問。用語→説明 と 説明→用語 を交互に
     「説明」は説明全文の冒頭からの抜粋（改変しない）。
     誤答の選択肢は正解のつながり先から優先して引き、足りなければ同じ出題区分から補う
     ===================================================== */
  var Q=null;

  /* 説明全文の冒頭の抜粋。1文目を使い、短すぎれば次の文をつなぐ。
     用語そのものを含む文は答えが見えるので飛ばす。長ければ読点で切って「…」 */
  var EXCERPT_SKIP={ 'IIIF':1 };   /* 1文目が英語の正式名だけの語は2文目から */
  var EXCERPT_MIN=20, EXCERPT_MAX=80, EXC={};
  function excerpt(c){
    if(EXC[c.id]) return EXC[c.id];
    var ss=c.body.split('。').filter(Boolean).map(function(x){ return x+'。'; });
    var core=c.term.replace(/（.*?）/g,''), i=EXCERPT_SKIP[c.id]||0;
    while(i<ss.length-1 && (ss[i].indexOf(c.term)>=0 || ss[i].indexOf(core)>=0)) i++;
    var t=ss[i];
    while(t.length<EXCERPT_MIN && i+1<ss.length) t+=ss[++i];
    if(t.length>EXCERPT_MAX){
      var cut=t.lastIndexOf('、', EXCERPT_MAX);
      t=t.slice(0, cut>EXCERPT_MIN ? cut : EXCERPT_MAX)+'…';
    }
    return (EXC[c.id]=t);
  }
  function startQuiz(){
    var today=dayKey();
    Object.keys(S.quizLog).forEach(function(id){ if(S.quizLog[id]!==today) delete S.quizLog[id]; });
    var pool=APPROVED.filter(function(c){ return !S.quizLog[c.id]; });
    if(pool.length<5) pool=APPROVED;
    Q={ items:shuffle(pool).slice(0,5), i:0, got:0, busy:false };
    show('quiz');
    renderQ();
  }
  function distractors(c){
    var picked={}, out=[];
    function add(x){
      if(out.length>=3 || !x || x.id===c.id || picked[x.id] || excerpt(x)===excerpt(c) || x.term===c.term) return;
      picked[x.id]=1; out.push(x);
    }
    shuffle(c.links||[]).forEach(function(l){ add(BYID[resolve(l)]); });
    shuffle(APPROVED.filter(function(x){ return x.exam.kind===c.exam.kind; })).forEach(add);
    shuffle(APPROVED).forEach(add);
    return out;
  }
  function renderQ(){
    var c=Q.items[Q.i], toDesc=Q.i%2===0;
    S.quizLog[c.id]=dayKey(); save();
    $('qN').textContent=(Q.i+1)+' / '+Q.items.length;
    $('qDir').textContent=toDesc ? '用語 → 説明' : '説明 → 用語';
    var qw=$('qWord'); qw.className='q-word '+(toDesc ? 'term' : 'desc'); qw.textContent=toDesc ? c.term : excerpt(c);
    var opts=shuffle([c].concat(distractors(c)));
    $('qOpts').innerHTML=opts.map(function(x){
      return '<button type="button" class="btn '+(toDesc ? 'desc' : 'term')+'" data-id="'+esc(x.id)+'">'+esc(toDesc ? excerpt(x) : x.term)+'</button>';
    }).join('');
    $('qPlus').classList.remove('on');
    Q.busy=false;
  }
  $('qOpts').addEventListener('click', function(e){
    var b=e.target.closest('.btn'); if(!b||Q.busy) return;
    Q.busy=true;
    var c=Q.items[Q.i], right=b.dataset.id===c.id;
    var rb=$('qOpts').querySelector('[data-id="'+CSS.escape(c.id)+'"]');
    rb.classList.add('ok');
    if(right){
      Q.got++; S.points++; save();
      $('qPlus').classList.add('on');
      setTimeout(nextQ, 800);
    }else{
      b.classList.add('ng');
      setTimeout(function(){ showAnswer(c); }, 500);
    }
  });
  /* 不正解：正解のカードを3秒だけ見せる */
  function showAnswer(c){

  function nextQ(){
